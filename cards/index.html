  {"n":"fahre","de":"Ich fahre nach Hause.","en":"I am going home (by vehicle).","lit":"I am going home (by vehicle).","gloss":"⟦fahre⟧: go, drive (with ⟦ich⟧).","note":"⟦Fahren⟧ = to go by vehicle. ⟦Gehen⟧ = on foot.","scene":"A man at the wheel of a car.","f":"Subject + fahre + place","t":[],"fam":"fahren · die Fahrt · die Fahrkarte · der Fahrer · die Abfahrt"},
  {"n":"rechts","de":"Die Haltestelle ist rechts.","en":"The stop is on the right.","lit":"The stop is on the right.","gloss":"⟦rechts⟧: right.","note":"","scene":"A person points right.","f":"Subject + sein + place","t":[],"opp":["links","left"]},
  {"n":"dem","de":"Ich fahre mit dem Bus.","en":"I take the bus.","lit":"I take the bus.","gloss":"⟦dem⟧: the (after ⟦mit⟧, with ⟦der⟧ and ⟦das⟧ nouns).","note":"⟦Mit⟧ always takes the dative: ⟦mit dem Bus, mit der Bahn, mit mir⟧.","scene":"A woman on a bus.","f":"Subject + fahre + mit + noun","t":["dative-primer"]},
  {"n":"taxi","de":"Ich nehme ein Taxi.","en":"I will take a taxi.","lit":"I will take a taxi.","gloss":"⟦das Taxi, die Taxis⟧: taxi, taxis.","note":"TAK-si, the x is ks like in English. ⟦Das Taxi, die Taxis⟧. Future: ⟦Ich nehme ein Taxi⟧ is present tense and means I will take a taxi.","scene":"A taxi at a curb.","f":"Subject + nehme + noun","t":["cognate"],"act":true},
  {"n":"weit","de":"Ist es weit?","en":"Is it far?","lit":"Is it far?","gloss":"⟦weit⟧: far.","note":"","scene":"A traveller looks at a map.","f":"Question, verb first","t":[],"opp":["nah","near"]},
  {"n":"nah","de":"Nein, es ist nah.","en":"No, it is near.","lit":"No, it is near.","gloss":"nah: near.","note":"","scene":"A local points down the street.","f":"Response chunk","t":[],"opp":["weit","far"]},
  {"n":"geradeaus","de":"Immer geradeaus.","en":"Straight ahead.","lit":"Straight ahead.","gloss":"⟦geradeaus⟧: straight ahead.","note":"","scene":"A woman points straight ahead.","f":"Direction chunk","t":[]},
  {"n":"war","de":"Ich war hier.","en":"I was here.","lit":"I was here.","gloss":"⟦war⟧: was (with ⟦ich, er, sie, es⟧).","note":"⟦War⟧ is the past of ⟦ist⟧ and ⟦bin⟧.","scene":"A man points at a spot on a floor.","f":"Subject + war + place","t":[]},
  {"n":"gestern","de":"Gestern war ich zu Hause.","en":"Yesterday I was at home.","lit":"Yesterday I was at home.","gloss":"⟦gestern⟧: yesterday.","note":"","scene":"A calendar page with yesterday.","f":"Time word first, verb second","t":[]},
  {"n":"hatte","de":"Ich hatte keine Zeit.","en":"I had no time.","lit":"I had no time.","gloss":"⟦hatte⟧: had (with ⟦ich, er, sie, es⟧).","note":"","scene":"A woman looks at her full diary.","f":"Subject + hatte + noun","t":[]},
  {"lit":"That fits well.","gloss":"⟦passt⟧: fits, suits (with ⟦er, sie, es⟧).","note":"⟦Passen⟧ is the everyday way to talk about plans: ⟦Das passt⟧ = that works for me. ⟦Das passt nicht⟧ = that does not suit me.","scene":"Two friends compare calendars.","f":"das + passt + adverb","t":[],"n":"passt","de":"Das passt gut.","en":"That suits me well."},
  {"n":"montag","de":"Montag geht nicht.","en":"Monday does not work.","lit":"Monday goes not.","gloss":"⟦der Montag, die Montage⟧: Monday, ⟦Mondays⟧.","note":"Days of the week are all ⟦der⟧ nouns: ⟦der Montag⟧. For on Monday you say am ⟦Montag⟧, soon.","scene":"A calendar with Monday circled.","f":"Day + geht + nicht","t":[]},
  {"n":"am","de":"Ich bin am Montag da.","en":"I will be there on Monday.","lit":"I will be there on Monday.","gloss":"am: on (a day), at.","note":"Am + day: am ⟦Montag⟧, am ⟦Freitag⟧. Future: a day plus the present tense makes the future: ⟦Ich bin⟧ am ⟦Montag da⟧ = I will be there on Monday.","scene":"A calendar with Monday circled.","f":"Subject + sein + am + day","t":[]},
  {"n":"wochenende","de":"Am Wochenende bin ich zu Hause.","en":"At the weekend I am at home.","lit":"At the weekend I am at home.","gloss":"⟦das Wochenende, die Wochenenden⟧: weekend, weekends.","note":"","scene":"A couple on a sofa.","f":"Time phrase first, verb second","t":[]},
  {"n":"morgens","de":"Morgens habe ich keine Zeit.","en":"In the morning I have no time.","lit":"In the morning I have no time.","gloss":"⟦morgens⟧: in the mornings.","note":"","scene":"A man rushes with a bag.","f":"Time word first, verb second","t":[]},
  {"n":"später","de":"Bis später.","en":"See you later today.","lit":"Until later.","gloss":"⟦später⟧: later.","note":"⟦Bis später⟧ is for when you have arranged to meet again later the same day. ⟦Bis dann⟧: meeting arranged for another day. ⟦Bis bald⟧: see you soon, no date set but you expect to meet. ⟦Bis zum nächsten Mal⟧: nothing arranged. If nothing is arranged, many people say no ⟦bis⟧ at all: Na ⟦dann, mach⟧'s ⟦gut⟧. Ciao. Or ⟦War schön, dich zu sehen⟧.","scene":"Two friends part.","f":"Farewell chunk","t":[]},
  {"n":"abends","de":"Abends bin ich zu Hause.","en":"In the evening I am at home.","lit":"In the evening I am at home.","gloss":"⟦abends⟧: in the evenings.","note":"","scene":"A woman on a sofa at night.","f":"Time word first, verb second","t":[]},
  {"n":"früh","de":"Es ist noch früh.","en":"It is still early.","lit":"It is still early.","gloss":"⟦früh⟧: early.","note":"","scene":"A clock shows six.","f":"es + sein + adjective","t":[],"opp":["spät","late"]},
  {"n":"dienstag","de":"Dienstag passt mir gut.","en":"Tuesday suits me well.","lit":"Tuesday fits me well.","gloss":"⟦der Dienstag, die Dienstage⟧: Tuesday, ⟦Tuesdays⟧.","note":"","scene":"A calendar with Tuesday crossed out.","f":"Day + passt + mir + gut","t":[]},
  {"n":"müde","de":"Ich bin ziemlich müde.","en":"I am pretty tired.","lit":"I am pretty tired.","gloss":"⟦müde⟧: tired.","note":"","scene":"A man yawns at a desk.","f":"Subject + sein + adjective","t":[],"opp":["wach","awake"]},
  {"n":"fahrer","de":"Der Fahrer ist müde.","en":"The driver is tired.","lit":"The driver is tired.","gloss":"⟦der Fahrer, die Fahrer⟧: driver, drivers.","note":"⟦Fahrer⟧ is masculine. Add ⟦-in⟧ for a woman: ⟦die Fahrerin⟧. Most ⟦-er⟧ nouns do not change in the plural.","scene":"A bus driver rubs his eyes at a red light.","f":"Word pattern: -er","t":["pattern"],"pat":"⟦-er⟧ names the person who does it: ⟦fahren⟧ / ⟦der Fahrer, lehren⟧ / ⟦der Lehrer, arbeiten⟧ / ⟦der Arbeiter, lesen⟧ / ⟦der Leser, kaufen⟧ / ⟦der Käufer⟧. For a woman add ⟦-in⟧: ⟦die Fahrerin, die Lehrerin⟧.","fam":"fahren · die Fahrt · der Fahrer · die Fahrerin"},
  {"n":"p-fahrerin","de":"Die Fahrerin ist müde.","en":"The driver is tired.","lit":"The driver (female) is tired.","gloss":"Nothing new: words you already know in a new combination.","note":"⟦Fahrer⟧ + ⟦-in⟧ = a woman who drives.","scene":"A woman at the wheel of a taxi at night.","f":"die + sein + adjective","t":["practice"],"p":true},
  {"n":"braun","de":"Das Haus ist braun.","en":"The house is brown.","lit":"The house is brown.","gloss":"⟦braun⟧: brown.","note":"Au is said like ow in how. R is rolled, more like a Spanish or Italian R: brrown.","scene":"A brown wooden house with a garden gate.","f":"Word pattern: sound shift au / ow","t":["pattern","sound shift"],"pat":"German au often matches English ou or ow. ⟦Haus⟧ house, ⟦Maus⟧ mouse, ⟦braun⟧ brown, ⟦Baum⟧ tree (beam), ⟦Traum⟧ dream, ⟦Raum⟧ room. After this card, these count as known words."},
  {"n":"schlafen","de":"Ich muss schlafen.","en":"I have to sleep.","lit":"I must sleep.","gloss":"⟦schlafen⟧: to sleep.","note":"⟦Ich muss schlafen⟧ is what you say when you are done for the day.","scene":"A woman closes her eyes.","f":"Subject + muss + infinitive","t":[],"fam":"schlafen · schlaflos (sleepless) · das Schlafzimmer · der Schlaf"},
  {"n":"duschen","de":"Ich will noch duschen.","en":"I still want to shower.","lit":"I want still to shower.","gloss":"⟦duschen⟧: to shower.","note":"⟦Noch⟧ here means still, before I go.","scene":"A traveller in a hotel corridor.","f":"Subject + will + noch + infinitive","t":[]},
  {"n":"wohnung","de":"Das ist meine Wohnung. Sie ist klein.","en":"That is my flat. It is small.","lit":"That is my flat. She is small.","gloss":"⟦die Wohnung, die Wohnungen⟧: flat, flats (also: apartment).","note":"⟦Wohnung⟧ is a ⟦die⟧ noun, so ⟦sie⟧ in the next sentence, not ⟦es⟧. German pronouns follow the grammatical gender: ⟦die Wohnung, sie⟧.","scene":"A woman at a flat door.","f":"das + sein + meine + noun","t":[],"fam":"wohnen · die Wohnung · der Mitbewohner"},
  {"n":"küche","de":"Die Küche ist auch klein.","en":"The kitchen is small too.","lit":"The kitchen is also small.","gloss":"⟦die Küche, die Küchen⟧: kitchen, kitchens.","note":"","scene":"A small kitchen.","f":"die + noun + sein + auch + adjective","t":[]},
  {"n":"suche","de":"Ich suche eine Wohnung.","en":"I am looking for a flat.","lit":"I search a flat.","gloss":"⟦suche⟧: look for (with ⟦ich⟧).","note":"⟦Suchen⟧ = to look for. ⟦Ich suche⟧... is how you start any search: ⟦Ich suche eine Wohnung, Ich suche mein Handy⟧.","scene":"A woman pats her pockets.","f":"Subject + suche + eine + noun","t":[]},
  {"n":"schlüssel","de":"Wo ist mein Schlüssel?","en":"Where is my key?","lit":"Where is my key?","gloss":"⟦der Schlüssel, die Schlüssel⟧: key, keys.","note":"","scene":"A man pats his pockets.","f":"Question word + verb","t":[]},
  {"n":"zimmer","de":"Das Zimmer ist groß.","en":"The room is big.","lit":"The room is big.","gloss":"⟦das Zimmer, die Zimmer⟧: room, rooms.","note":"","scene":"A large bright room.","f":"das + noun + sein + adjective","t":[]},
  {"n":"fenster","de":"Das Fenster ist zu.","en":"The window is closed.","lit":"The window is closed.","gloss":"⟦das Fenster, die Fenster⟧: window, windows.","note":"⟦Zu⟧ also means closed.","scene":"A closed window.","f":"Subject + sein + zu","t":[]},
  {"n":"telefon","de":"Ich habe kein Telefon.","en":"I have no phone.","lit":"I have no phone.","gloss":"⟦das Telefon, die Telefone⟧: phone, phones.","note":"Stress the first syllable: TE-le-fon. German often spells ph as f: ⟦Telefon, Foto, Fotograf⟧.","scene":"A man shows empty hands.","f":"Subject + haben + kein + noun","t":["cognate"],"act":true},
  {"n":"miete","de":"Die Miete ist wirklich teuer.","en":"The rent is really expensive.","lit":"The rent is really expensive.","gloss":"⟦die Miete, die Mieten⟧: rent, rents.","note":"","scene":"A tenant looks at a bill.","f":"die + noun + sein + adjective","t":[]},
  {"n":"nachbar","de":"Das ist unser Nachbar.","en":"That is our neighbour.","lit":"That is our neighbour.","gloss":"⟦der Nachbar, die Nachbarn⟧: neighbour, neighbours.","note":"","scene":"Two men wave over a fence.","f":"das + sein + unser + noun","t":[]},
  {"n":"nummer","de":"Wie ist die Nummer?","en":"What is the number?","lit":"What is the number?","gloss":"⟦die Nummer, die Nummern⟧: number, numbers.","note":"","scene":"A clerk holds a pen over a form.","f":"Question word + verb","t":[]},
  {"n":"essbar","de":"Ist das essbar?","en":"Is that edible?","lit":"Is that eat-able?","gloss":"⟦essbar⟧: edible (⟦essen⟧ + ⟦-bar⟧).","note":"⟦Ist das essbar⟧? is a handy question at a market. ⟦Wunderbar⟧ you may know already.","scene":"A man holds a strange fruit at a market stall.","f":"Word pattern: -bar","t":["pattern"],"pat":"⟦-bar⟧ = -able. Add it to a verb stem: ⟦essen⟧ / ⟦essbar, machen⟧ / ⟦machbar, trinken⟧ / ⟦trinkbar, danken⟧ / ⟦dankbar, bezahlen⟧ / ⟦bezahlbar⟧. ⟦Wunderbar⟧ (wonderful) works the same way.","fam":"essen · essbar · trinkbar · machbar · wunderbar"},
  {"n":"salz","de":"Das Salz, bitte.","en":"The salt, please.","lit":"The salt, please.","gloss":"⟦das Salz⟧: salt (no plural).","note":"Say ⟦Das Salz, bitte⟧ at the table. Z is always ts: ⟦Salz⟧ sounds like zalts.","scene":"A woman at a restaurant table points at the salt.","f":"Word pattern: sound shift t / z","t":["pattern","sound shift"],"pat":"German z, tz or ss often matches English t. ⟦Zeit⟧ time, ⟦zehn⟧ ten, ⟦zwei⟧ two, ⟦zu⟧ to, ⟦Zahn⟧ tooth, ⟦Zunge⟧ tongue, ⟦Herz⟧ heart, ⟦Salz⟧ salt, ⟦sitzen⟧ sit, ⟦setzen⟧ set, ⟦Katze⟧ cat. After this card, all of these count as known words."},
  {"n":"p-telefonnummer","p":true,"de":"Meine Nummer ist zwei, sechs, vier, fünf, acht.","en":"My number is 2 6 4 5 8.","lit":"My number is 2 6 4 5 8.","gloss":"Nothing new: words you already know in a new combination.","note":"Phone numbers are read out digit by digit or in pairs. A zero is ⟦null⟧. Say ⟦Meine Nummer ist⟧... when you give your number.","scene":"A person writes a number on a note.","f":"Subject + sein + numbers","t":[]},
  {"n":"kaputt","de":"Das ist kaputt.","en":"That is broken.","lit":"That is broken.","gloss":"⟦kaputt⟧: broken.","note":"","scene":"A man holds a broken lamp.","f":"das + sein + adjective","t":[],"opp":["ganz","intact, whole"]},
  {"n":"haustür","de":"Die Haustür ist kaputt.","en":"The front door is broken.","lit":"The house-door is broken.","gloss":"⟦die Haustür, die Haustüren⟧: front door, front doors.","note":"Read a compound from the back: ⟦Haustür⟧ is a kind of ⟦Tür⟧. You already know both parts, so you can guess the rest.","scene":"A woman stands at a house door with a bag of shopping.","f":"Word pattern: compound","t":["pattern"],"pat":"German glues nouns together. The last word decides gender and plural: ⟦das Haus⟧ + ⟦die Tür⟧ = ⟦die Haustür⟧. Compounds of words you know are free: ⟦Hausschlüssel, Wochenende, Geburtstag⟧.","fam":"das Haus · die Tür · die Haustür · die Wohnungstür","act":true},
  {"n":"adresse","de":"Wie ist die Adresse?","en":"What is the address?","lit":"What is the address?","gloss":"⟦die Adresse, die Adressen⟧: address, addresses.","note":"","scene":"A courier looks at a parcel.","f":"Question word + verb","t":[]},
  {"n":"handy","de":"Mein Handy ist schon wieder kaputt.","en":"My phone is broken again.","lit":"My phone is broken again.","gloss":"⟦das Handy, die Handys⟧: mobile phone, mobile phones.","note":"Handy is the German word for mobile phone.","scene":"A woman holds a cracked phone.","f":"Subject + sein + adjective","t":["false friend"],"ff":"⟦Handy⟧ is the German word for a mobile phone. It is not an English adjective. A person who is handy = ⟦geschickt⟧."},
  {"lit":"I am looking for my phone.","gloss":"Nothing new: words you already know in a new combination.","note":"Same verb, new object.","scene":"A woman pats her pockets.","f":"Subject + suche + mein + noun","t":[],"n":"suche-handy","p":true,"de":"Ich suche mein Handy.","en":"I am looking for my phone."},
  {"lit":"Name, age, address, telephone, number.","gloss":"⟦das Alter⟧: age (no plural). The other words are form fields you know.","note":"Filling in a form. Name: Anna ⟦Weber⟧. ⟦Alter⟧: 34. ⟦Adresse⟧: ⟦Lindenstraße⟧ 5, 45127 ⟦Essen⟧. ⟦Telefon⟧: 0151 2345678. ⟦Alter⟧ is the noun for age: ⟦das Alter⟧. In speech you ask ⟦Wie alt bist du⟧?","scene":"A person fills in a registration form at a desk.","f":"Form fields","t":["admin","sos"],"n":"alter","de":"Name, Alter, Adresse, Telefon, Nummer.","en":"Name, age, address, phone, number."},
  {"n":"tschüss","de":"Tschüss, bis morgen.","en":"Bye, see you tomorrow.","lit":"Bye, see you tomorrow.","gloss":"⟦tschüss⟧: bye.","note":"Casual goodbye. ⟦Auf Wiedersehen⟧ is formal.","scene":"Two friends wave.","f":"Farewell chunk","t":["sos"]},
  {"n":"vater","de":"Das ist mein Vater.","en":"That is my father.","lit":"That is my father.","gloss":"⟦der Vater, die Väter⟧: father, fathers.","note":"","scene":"A family photo.","f":"das + sein + mein + noun","t":[]},
  {"n":"mutter","de":"Meine Mutter ist da.","en":"My mother is here.","lit":"My mother is there.","gloss":"⟦die Mutter, die Mütter⟧: mother, mothers.","note":"","scene":"A woman at a door.","f":"Subject + sein + da","t":[]},
  {"n":"bruder","de":"Ich habe einen Bruder.","en":"I have a brother.","lit":"I have a brother.","gloss":"⟦der Bruder, die Brüder⟧: brother, brothers.","note":"","scene":"Two boys in a photo.","f":"Subject + haben + einen + noun","t":[]},
  {"n":"schwester","de":"Ich habe eine Schwester.","en":"I have a sister.","lit":"I have a sister.","gloss":"⟦die Schwester, die Schwestern⟧: sister, sisters.","note":"","scene":"Two girls in a photo.","f":"Subject + haben + eine + noun","t":[]},
  {"n":"eltern","de":"Meine Eltern sind hier.","en":"My parents are here.","lit":"My parents are here.","gloss":"⟦die Eltern⟧: parents (plural only).","note":"","scene":"An older couple at a door.","f":"Subject + sein + place","t":[]},
  {"n":"wohnzimmer","de":"Das Wohnzimmer ist klein.","en":"The living room is small.","lit":"The live-room is small.","gloss":"⟦das Wohnzimmer, die Wohnzimmer⟧: living room, living rooms.","note":"Compounds of words you know are known. ⟦Wohnzimmer⟧ is ⟦wohn-⟧ (from ⟦wohnen⟧) plus ⟦Zimmer⟧.","scene":"A small living room with a sofa and a lamp.","f":"Word pattern: compound","t":["pattern"],"pat":"The first part can be a verb stem: ⟦wohnen⟧ + ⟦das Zimmer⟧ = ⟦das Wohnzimmer, schlafen⟧ + ⟦das Zimmer⟧ = ⟦das Schlafzimmer, baden⟧ + ⟦das Zimmer⟧ = ⟦das Badezimmer⟧. Last word decides gender.","fam":"wohnen · das Zimmer · das Wohnzimmer · das Schlafzimmer · das Badezimmer","act":true},
  {"n":"kind","de":"Wir haben ein Kind.","en":"We have one child.","lit":"We have a child.","gloss":"⟦das Kind, die Kinder⟧: child, children.","note":"German-speaking parents mostly say ⟦Kind⟧ or ⟦Kinder⟧ for their sons and daughters. ⟦Sohn, Söhne⟧ or ⟦Tochter, Töchter⟧ is only used when the gender matters.","scene":"A parent holds a child's hand.","f":"Subject + haben + ein + noun","t":["false friend"],"ff":"⟦Kind⟧ = child, not the adjective kind. For kind say ⟦nett⟧ or ⟦freundlich⟧."},
  {"n":"sohn","de":"Unser Sohn ist noch klein.","en":"Our son is still small.","lit":"Our son is still small.","gloss":"⟦der Sohn, die Söhne⟧: son, sons.","note":"","scene":"A parent and a small boy.","f":"Possessive + noun + sein + noch + adjective","t":[]},
  {"n":"tochter","de":"Meine Tochter ist groß für ihr Alter.","en":"My daughter is tall for her age.","lit":"My daughter is big for her age.","gloss":"⟦die Tochter, die Töchter⟧: daughter, daughters.","note":"⟦Ihr⟧ here is her. ⟦Groß⟧ means big and tall. ⟦Für ihr Alter⟧ is a very common phrase for children.","scene":"A parent and a tall girl.","f":"Subject + sein + adjective + für + ihr + noun","t":[]},
  {"n":"mittwoch","de":"Am Mittwoch kann ich nicht.","en":"On Wednesday I cannot.","lit":"On Wednesday can I not.","gloss":"⟦der Mittwoch, die Mittwoche⟧: Wednesday, ⟦Wednesdays⟧.","note":"","scene":"A calendar with Wednesday circled.","f":"Time phrase first, verb second","t":[]},
  {"n":"verheiratet","de":"Ich bin verheiratet.","en":"I am married.","lit":"I am married.","gloss":"⟦verheiratet⟧: married.","note":"","scene":"A man shows a ring.","f":"Subject + sein + adjective","t":[],"opp":["ledig","single (unmarried)"]},
  {"n":"pünktlich","de":"Ich bin pünktlich.","en":"I am on time.","lit":"I am on time.","gloss":"⟦pünktlich⟧: punctual, on time.","note":"Being ⟦pünktlich⟧ matters a lot in Germany.","scene":"A woman at a door with a watch.","f":"Subject + sein + adjective","t":[],"opp":["unpünktlich","not on time"]},
  {"n":"donnerstag","de":"Donnerstag passt nicht.","en":"Thursday does not suit me.","lit":"Thursday fits not.","gloss":"⟦der Donnerstag, die Donnerstage⟧: Thursday, ⟦Thursdays⟧.","note":"","scene":"A calendar with Thursday circled.","f":"Day + passt + nicht","t":[]},
  {"n":"nachmittag","de":"Am Nachmittag bin ich da.","en":"In the afternoon I will be there.","lit":"In the afternoon I will be there.","gloss":"⟦der Nachmittag, die Nachmittage⟧: afternoon, afternoons.","note":"Future: a time phrase plus the present tense: Am ⟦Nachmittag bin ich da⟧ = I will be there in the afternoon.","scene":"A clock shows three.","f":"Time phrase first, verb second","t":[]},
  {"lit":"At the morning, at the before-noon, at the noon, at the afternoon, at the evening, in the night.","gloss":"⟦der Vormittag, die Vormittage⟧: late morning (about 9 to 12). ⟦der Mittag, die Mittage⟧: noon, midday.","note":"The parts of the day. ⟦Morgen, Vormittag, Mittag, Nachmittag⟧ and ⟦Abend⟧ take am (an ⟦dem⟧). ⟦Nacht⟧ takes in ⟦der⟧: in ⟦der Nacht⟧. ⟦Mittag⟧ ends in a k sound: MIT-tahk.","scene":"A day clock showing six parts of the day.","f":"Time phrases","t":["time"],"n":"vormittag+mittag","u":["vormittag","mittag"],"de":"Am Morgen, am Vormittag, am Mittag, am Nachmittag, am Abend, in der Nacht.","en":"In the morning, late morning, at noon, in the afternoon, in the evening, at night."},
  {"n":"sauber","de":"Das Zimmer ist sehr sauber.","en":"The room is very clean.","lit":"The room is very clean.","gloss":"⟦sauber⟧: clean.","note":"","scene":"A tidy hotel room.","f":"das + noun + sein + adjective","t":[],"opp":["schmutzig","dirty"],"fam":"sauber · die Sauberkeit · säubern (to clean)"},
  {"n":"freitag","de":"Geht es am Freitag?","en":"Does Friday work?","lit":"Goes it on Friday?","gloss":"⟦der Freitag, die Freitage⟧: Friday, ⟦Fridays⟧.","note":"⟦Geht es⟧ am ⟦Freitag⟧? is a very natural way to propose a day. Without a verb: ⟦Und Freitag⟧?","scene":"A calendar with Friday crossed out.","f":"Question, verb first","t":[]},
  {"n":"samstag","de":"Am Samstag haben wir Zeit.","en":"On Saturday we have time.","lit":"On Saturday have we time.","gloss":"⟦der Samstag, die Samstage⟧: Saturday, ⟦Saturdays⟧.","note":"","scene":"A calendar with Saturday circled.","f":"Time phrase first, verb second","t":[]},
  {"n":"bett","de":"Das Bett ist klein.","en":"The bed is small.","lit":"The bed is small.","gloss":"⟦das Bett, die Betten⟧: bed, beds.","note":"","scene":"A single bed.","f":"das + noun + sein + adjective","t":[]},
  {"n":"sonntag","de":"Am Sonntag können wir nicht.","en":"On Sunday we cannot.","lit":"On Sunday can we not.","gloss":"⟦der Sonntag, die Sonntage⟧: Sunday, ⟦Sundays⟧.","note":"","scene":"A family at a table.","f":"Time phrase first, verb second","t":[]},
  {"lit":"Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.","gloss":"Nothing new: words you already know in a new combination.","note":"All seven days. Some people say ⟦Sonnabend⟧ for ⟦Samstag⟧ in the north and east of Germany. The week starts on Monday.","scene":"A wall calendar with the seven days.","f":"Word list","t":[],"n":"alle-tage","p":true,"de":"Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag.","en":"Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday."},
  {"lit":"From Monday to Friday.","gloss":"Nothing new: words you already know in a new combination.","note":"⟦Von⟧ ... ⟦bis⟧ ... marks a range: ⟦von Montag bis Freitag, von neun bis fünf⟧.","scene":"A calendar with Monday to Friday highlighted.","f":"Fixed chunk","t":[],"n":"von-bis","p":true,"de":"Von Montag bis Freitag.","en":"From Monday to Friday."},
  {"n":"monat","de":"Ich bin einen Monat hier.","en":"I am here for a month.","lit":"I am a month here.","gloss":"⟦der Monat, die Monate⟧: month, months.","note":"⟦Einen Monat⟧ = for one month. ⟦Seit einem Monat⟧ (for a month already) comes later.","scene":"A calendar with a month marked.","f":"Subject + sein + einen + noun","t":[],"fam":"der Monat · monatlich (monthly)"},
  {"n":"arzt","de":"Ich brauche einen Arzt.","en":"I need a doctor.","lit":"I need a doctor.","gloss":"⟦der Arzt, die Ärzte⟧: doctor, doctors.","note":"⟦Arzt⟧ is the male doctor, ⟦Ärztin⟧ the female one. Most people just say ⟦zum Arzt gehen⟧.","scene":"A man holds his arm in a waiting room.","f":"Subject + brauche + einen + noun","t":["sos"],"gp":"Also: die Ärztin, die Ärztinnen"},
  {"n":"krank","de":"Ich bin krank.","en":"I am sick.","lit":"I am sick.","gloss":"⟦krank⟧: sick.","note":"","scene":"A woman sneezes under a blanket.","f":"Subject + sein + adjective","t":[],"opp":["gesund","healthy"],"fam":"krank · die Krankheit · das Krankenhaus · der Kranke"},
  {"n":"p-kind-krank","de":"Mein Kind ist krank.","en":"My child is sick.","lit":"My child is sick.","gloss":"Nothing new: words you already know in a new combination.","note":"⟦Krank⟧ also works for people with a cold, not only serious illness.","scene":"A parent on the phone with a school.","f":"","t":[],"p":true},
  {"n":"schmerzen","de":"Ich habe Schmerzen.","en":"I am in pain.","lit":"I am in pain.","gloss":"⟦der Schmerz, die Schmerzen⟧: pain, pains (usually plural).","note":"German says I have pains: ⟦Schmerzen⟧ is plural.","scene":"A man holds his back.","f":"Subject + haben + noun","t":["sos"]},
  {"n":"weh","de":"Das tut weh.","en":"That hurts.","lit":"That hurts.","gloss":"⟦weh⟧: hurts (⟦tut weh⟧).","note":"⟦Tut weh⟧ is the everyday way to say it hurts.","scene":"A woman touches her elbow.","f":"das + tut + weh","t":["sos"]},
  {"n":"fuß","de":"Mein Fuß tut weh.","en":"My foot hurts.","lit":"My foot does hurt.","gloss":"⟦der Fuß, die Füße⟧: foot, feet.","note":"The ß sounds like a sharp s. ⟦Das tut weh⟧ also works for a foot: ⟦Mein Fuß tut weh⟧.","scene":"A woman sits down and rubs her foot.","f":"Word pattern: sound shift ss / ß / t","t":["pattern","sound shift"],"pat":"German ss or ß often matches English t. ⟦Wasser⟧ water, ⟦essen⟧ eat, ⟦besser⟧ better, ⟦groß⟧ great, ⟦heiß⟧ hot, ⟦Fuß⟧ foot, was what, ⟦das⟧ that, ⟦Straße⟧ street, ⟦beißen⟧ bite. After this card, these count as known words."},
  {"n":"p-tut-leid","de":"Das tut mir leid.","en":"I am sorry about that.","lit":"I am sorry about that.","gloss":"Nothing new: words you already know in a new combination.","note":"⟦Es tut mir leid⟧ is about you. ⟦Das tut mir leid⟧ answers bad news.","scene":"A man hears bad news.","f":"","t":[],"p":true},
  {"n":"apotheke","de":"Wo ist die Apotheke?","en":"Where is the pharmacy?","lit":"Where is the pharmacy?","gloss":"⟦die Apotheke, die Apotheken⟧: pharmacy, pharmacies.","note":"In Germany many medicines only come from an ⟦Apotheke⟧.","scene":"A traveller looks at a street sign.","f":"Question word + sein + die + noun","t":[]},
  {"n":"polizei","de":"Ich brauche die Polizei.","en":"I need the police.","lit":"I need the police.","gloss":"⟦die Polizei⟧: police (no plural).","note":"Emergency numbers in Germany: 110 police, 112 fire and ambulance.","scene":"A woman holds up a phone.","f":"Subject + brauche + die + noun","t":["sos"]},
  {"n":"ins","de":"Ich muss ins Bett.","en":"I have to go to bed.","lit":"I have to go to bed.","gloss":"⟦ins⟧: into the, to the (in + ⟦das⟧).","note":"⟦Ins⟧ = in ⟦das⟧. It is the direction form: ⟦Ich gehe ins Bett⟧.","scene":"A tired man at the door of a bedroom.","f":"Subject + muss + ins + noun","t":[]},

  {"n":"arbeit","de":"Ich habe viel Arbeit.","en":"I have a lot of work.","lit":"I have a lot of work.","gloss":"⟦die Arbeit, die Arbeiten⟧: work, works.","note":"⟦Arbeit⟧ is work in general and also the job.","scene":"A desk covered with papers.","f":"Subject + haben + viel + noun","t":[],"fam":"arbeiten · die Arbeit · der Arbeiter"},
  {"n":"chef","de":"Mein Chef ist nicht da.","en":"My boss is not here.","lit":"My boss is not here.","gloss":"⟦der Chef, die Chefs⟧: boss, bosses.","note":"","scene":"A woman looks at an empty office.","f":"Subject + sein + nicht + da","t":["false friend"],"ff":"⟦Chef⟧ = boss or head of a team, not only a cook. A cook in a restaurant is ⟦der Koch⟧."},
  {"n":"firma","de":"Das ist meine Firma.","en":"That is my company.","lit":"That is my company.","gloss":"⟦die Firma, die Firmen⟧: company, companies.","note":"","scene":"A man points at a building.","f":"das + sein + meine + noun","t":[]},
  {"n":"termin","de":"Ich habe einen Termin.","en":"I have an appointment.","lit":"I have an appointment.","gloss":"⟦der Termin, die Termine⟧: appointment, appointments.","note":"⟦Termin⟧ is for doctors, offices and meetings. Not for a date with a friend.","scene":"A woman checks her phone calendar.","f":"Subject + haben + einen + noun","t":["sos"],"fam":"der Termin · vereinbaren (to arrange) · der Terminkalender"},
  {"n":"p-termin-zeit","p":true,"de":"Ich habe einen Termin um zehn Uhr dreißig.","en":"I have an appointment at 10:30.","lit":"I have an appointment at 10:30.","gloss":"Nothing new: words you already know in a new combination.","note":"Digital time is read as it is written: ⟦zehn Uhr dreißig⟧. In speech you also hear ⟦halb elf⟧ (half to eleven).","scene":"A person looks at an appointment card.","f":"Subject + haben + einen + noun + um + Uhrzeit","t":[]},
  {"n":"p-termin-absage","p":true,"de":"Der Termin um zehn Uhr geht nicht.","en":"The ten o'clock appointment does not work.","lit":"The ten o'clock appointment does not work.","gloss":"Nothing new: words you already know in a new combination.","note":"What you say to move or cancel an appointment. Add a new time: ⟦Der Termin geht nicht⟧. ⟦Geht es um zwölf Uhr⟧?","scene":"A person on the phone crosses out an appointment.","f":"Subject + geht + nicht","t":[]},
  {"n":"kollege","de":"Das ist mein Kollege.","en":"That is my colleague.","lit":"That is my colleague.","gloss":"⟦der Kollege, die Kollegen⟧: colleague, colleagues.","note":"⟦Kollegin⟧ is the female colleague.","scene":"A man introduces a coworker.","f":"das + sein + mein + noun","t":[]},
  {"n":"plan","de":"Ich habe einen Plan.","en":"I have a plan.","lit":"I have a plan.","gloss":"⟦der Plan, die Pläne⟧: plan, plans.","note":"PLAHN with a long a, like in father. ⟦Der Plan, die Pläne⟧. It also means schedule.","scene":"A man points at a sketch on a whiteboard.","f":"Subject + haben + einen + noun","t":["cognate"],"act":true},
  {"n":"nachricht","de":"Ich habe eine Nachricht.","en":"I have a message.","lit":"I have a message.","gloss":"⟦die Nachricht, die Nachrichten⟧: message, messages (also: news).","note":"","scene":"A woman looks at her phone.","f":"Subject + haben + eine + noun","t":[]},
  {"n":"im","de":"Ich bin im Moment nicht da.","en":"I am not here at the moment.","lit":"I am not here at the moment.","gloss":"⟦im⟧: in the (in + ⟦dem⟧).","note":"⟦Im Moment⟧ = at the moment. ⟦Im⟧ = in ⟦dem⟧.","scene":"A man on the phone looks out of a window.","f":"Subject + sein + im + noun","t":[]},
  {"n":"p-im-buero","de":"Ich wohne im Zentrum.","en":"I live in the centre.","lit":"I live in the centre.","gloss":"Nothing new: words you already know in a new combination.","note":"⟦Zentrum⟧ is a cognate (centre). ⟦Im⟧ = in ⟦dem⟧: ⟦im Zentrum, im Büro, im Hotel⟧.","scene":"A woman at her desk.","f":"","t":[],"p":true},
  {"n":"sprache","de":"Deutsch ist eine Sprache.","en":"German is a language.","lit":"German is a language.","gloss":"⟦die Sprache, die Sprachen⟧: language, languages.","note":"","scene":"A learner holds a book.","f":"Subject + sein + eine + noun","t":[],"fam":"sprechen · die Sprache · sprachlos (speechless)"},
  {"n":"leicht","de":"Deutsch ist nicht leicht.","en":"German is not easy.","lit":"German is not easy.","gloss":"⟦leicht⟧: easy, light.","note":"⟦Leicht⟧ also means light, as in not heavy.","scene":"A learner looks at a grammar table.","f":"Subject + sein + nicht + adjective","t":[],"opp":["schwer","hard, heavy"]},
  {"n":"brot","de":"Ich möchte Brot, bitte.","en":"I would like some bread, please.","lit":"I would like some bread, please.","gloss":"⟦das Brot, die Brote⟧: bread, breads.","note":"Bread is a big deal in Germany: hundreds of kinds.","scene":"A customer at a bakery counter.","f":"Subject + möchte + noun + bitte","t":[]},
  {"n":"wetter","de":"Das Wetter ist schön.","en":"The weather is nice.","lit":"The weather is nice.","gloss":"⟦das Wetter⟧: weather (no plural).","note":"Small talk in every language starts with the weather.","scene":"Two neighbours look at the sky.","f":"Subject + sein + adjective","t":[]},
  {"n":"heiß","de":"Es ist heute heiß.","en":"It is hot today.","lit":"It is hot today.","gloss":"⟦heiß⟧: hot.","note":"","scene":"A man wipes his forehead in the sun.","f":"es + sein + heute + adjective","t":[],"opp":["kalt","cold"]},
  {"n":"bier","de":"Ein Bier, bitte.","en":"A beer, please.","lit":"A beer, please.","gloss":"⟦das Bier, die Biere⟧: beer, beers.","note":"Sounds like English beer: ie is a long ee. ⟦Das Bier, die Biere⟧.","scene":"A guest at a pub table.","f":"Order chunk","t":["cognate"],"act":true},
  {"n":"kalt","de":"Es ist kalt.","en":"It is cold.","lit":"It is cold.","gloss":"⟦kalt⟧: cold.","note":"","scene":"A woman in a coat on a street.","f":"es + sein + adjective","t":[],"opp":["heiß","hot"]},
  {"n":"warm","de":"Hier ist es warm.","en":"It is warm here.","lit":"It is warm here.","gloss":"warm: warm.","note":"⟦Hier ist es⟧...: German puts the place first and keeps ⟦es⟧.","scene":"A man steps into a heated room.","f":"Place + sein + es + adjective","t":[],"opp":["kalt","cold"]},
  {"n":"kirche","de":"Die Kirche ist groß.","en":"The church is big.","lit":"The church is big.","gloss":"⟦die Kirche, die Kirchen⟧: church, churches.","note":"In ⟦Kirche⟧ the ch is soft, said with the tongue forward: KIR-che.","scene":"A small church with a tall tower on a village square.","f":"Word pattern: sound shift k / ch","t":["pattern","sound shift"],"pat":"German ch (and k) often matches English k, and the reverse. ⟦machen⟧ make, ⟦Buch⟧ book, ⟦Woche⟧ week, ⟦Milch⟧ milk, ⟦Kuchen⟧ cake, ⟦kochen⟧ cook, ⟦brechen⟧ break, ⟦suchen⟧ seek, ⟦Kirche⟧ church. After this card, these count as known words."},
  {"n":"möglichkeit","de":"Das ist eine Möglichkeit.","en":"That is one possibility.","lit":"That is a possibility.","gloss":"⟦die Möglichkeit, die Möglichkeiten⟧: possibility, possibilities.","note":"Use ⟦-keit⟧ after adjectives ending in ⟦-ig⟧ or ⟦-lich⟧, and ⟦-heit⟧ after most others.","scene":"Two colleagues at a whiteboard point at one of several options.","f":"Word pattern: -keit","t":["pattern"],"pat":"⟦-keit⟧ and ⟦-heit⟧ turn an adjective into a noun, like English -ness or -ity. These nouns are always ⟦die⟧: ⟦möglich⟧ / ⟦die Möglichkeit, gesund⟧ / ⟦die Gesundheit, frei⟧ / ⟦die Freiheit, krank⟧ / ⟦die Krankheit⟧.","fam":"möglich · unmöglich · die Möglichkeit"},
  {"n":"wein","de":"Ein Glas Wein, bitte.","en":"A glass of wine, please.","lit":"A glass wine, please.","gloss":"⟦der Wein, die Weine⟧: wine, wines.","note":"w = v and ei = eye, so it sounds like English vine: VINE. ⟦Der Wein, die Weine⟧. ⟦Das Glas, die Gläser⟧ = glass. ⟦Rotwein⟧ = red wine, ⟦Weißwein⟧ = white wine.","scene":"A guest in a restaurant.","f":"Order chunk","t":["cognate"],"act":true},
  {"n":"sonne","de":"Die Sonne ist schön.","en":"The sun is nice.","lit":"The sun is nice.","gloss":"⟦die Sonne⟧: sun (no plural).","note":"","scene":"A woman on a terrace closes her eyes.","f":"die + noun + sein + adjective","t":[]},
  {"n":"stein","de":"Der Stein ist klein.","en":"The stone is small.","lit":"The stone is small.","gloss":"⟦der Stein, die Steine⟧: stone, stones.","note":"Ei is said like the word eye. ⟦Klein⟧ is the one you already know.","scene":"A child holds a small stone in an open hand.","f":"Word pattern: sound shift ei / o","t":["pattern","sound shift"],"pat":"German ei often matches English o or oa. ⟦Stein⟧ stone, ⟦Bein⟧ bone (leg), ⟦Seife⟧ soap, ⟦heim⟧ home. Sometimes ei is simply a long i: ⟦Wein⟧ wine, ⟦mein⟧ mine, ⟦Eis⟧ ice. After this card, these count as known words."},
  {"n":"kuchen","de":"Kuchen, bitte.","en":"Cake, please.","lit":"Cake, please.","gloss":"⟦der Kuchen, die Kuchen⟧: cake, cakes.","note":"⟦Kaffee und Kuchen⟧ is a German afternoon ritual.","scene":"A plate with a slice of cake.","f":"Order chunk","t":[]},
  {"n":"lecker","de":"Das ist lecker.","en":"That is delicious.","lit":"That is delicious.","gloss":"⟦lecker⟧: tasty.","note":"","scene":"A woman tastes a cake and smiles.","f":"das + sein + adjective","t":[],"opp":["eklig","disgusting"]},
  {"n":"supermarkt","de":"Wo ist der Supermarkt?","en":"Where is the supermarket?","lit":"Where is the supermarket?","gloss":"⟦der Supermarkt, die Supermärkte⟧: supermarket, supermarkets.","note":"","scene":"A tourist on a street corner.","f":"Question word + sein + der + noun","t":[]},
  {"n":"geschäft","de":"Das Geschäft ist zu.","en":"The shop is closed.","lit":"The shop is closed.","gloss":"⟦das Geschäft, die Geschäfte⟧: shop, shops (also: business).","note":"Most shops close on Sunday in Germany.","scene":"A man in front of a closed shop.","f":"Subject + sein + zu","t":[]},
  {"n":"preis","de":"Der Preis ist gut.","en":"The price is good.","lit":"The price is good.","gloss":"⟦der Preis, die Preise⟧: price, prices.","note":"","scene":"A customer reads a price tag and smiles.","f":"Subject + sein + adjective","t":[]},

  {"n":"flughafen","de":"Ich bin am Flughafen.","en":"I am at the airport.","lit":"I am at the airport.","gloss":"⟦der Flughafen, die Flughäfen⟧: airport, airports.","note":"","scene":"A man with a suitcase in a terminal.","f":"Subject + sein + am + noun","t":[]},
  {"n":"koffer","de":"Wo ist mein Koffer?","en":"Where is my suitcase?","lit":"Where is my suitcase?","gloss":"⟦der Koffer, die Koffer⟧: suitcase, suitcases.","note":"","scene":"A traveller at an empty baggage belt.","f":"Question word + sein + mein + noun","t":[]},
  {"n":"hotel","de":"Ich bin im Hotel.","en":"I am at the hotel.","lit":"I am at the hotel.","gloss":"⟦das Hotel, die Hotels⟧: hotel, hotels.","note":"Stress the last syllable: ho-TEL. ⟦Das Hotel, die Hotels⟧.","scene":"A man at a hotel lobby.","f":"Subject + sein + im + noun","t":["cognate"],"act":true},

  {"n":"flug","de":"Der Flug ist früh.","en":"The flight is early.","lit":"The flight is early.","gloss":"⟦der Flug, die Flüge⟧: flight, flights.","note":"","scene":"A man looks at a departure board.","f":"Subject + sein + adjective","t":[]},
  {"n":"aus","de":"Ich komme aus Brasilien.","en":"I come from Brazil.","lit":"I come from Brazil.","gloss":"⟦aus⟧: from, out of.","note":"⟦Aus⟧ + country or town for where you are from: ⟦Ich komme aus Brasilien⟧. Not ⟦von⟧. ⟦Von⟧ is for coming back from a place, like ⟦gerade vom Supermarkt⟧. Use your own country here.","scene":"A woman holds up a flag pin.","f":"Subject + komme + aus + country","t":[]},
  {"n":"p-woher-aus","de":"Woher kommst du? Aus Brasilien.","en":"Where are you from? From Brazil.","lit":"Where are you from? From Brazil.","gloss":"Nothing new: words you already know in a new combination.","note":"","scene":"Two travellers talk at a hostel.","f":"Question and answer chunk","t":[],"p":true},
  {"n":"deutschland","de":"Ich wohne in Deutschland.","en":"I live in Germany.","lit":"I live in Germany.","gloss":"(⟦das⟧) ⟦Deutschland⟧: Germany (no plural).","note":"","scene":"A map with Germany marked.","f":"Subject + wohne + in + country","t":[]},
  {"n":"p-wohne-berlin","de":"Ich wohne in Berlin.","en":"I live in Berlin.","lit":"I live in Berlin.","gloss":"Nothing new: words you already know in a new combination.","note":"Swap in your own city name.","scene":"A woman points at a city on a map.","f":"Subject + wohne + in + city","t":[],"p":true},
  {"n":"lese","de":"Ich lese gern.","en":"I like to read.","lit":"I like to read.","gloss":"⟦lese⟧: read (with ⟦ich⟧).","note":"⟦Gern⟧ after a verb says you like doing it: ⟦Ich lese gern⟧.","scene":"A man in an armchair with a book.","f":"Subject + verb + gern","t":[],"fam":"lesen · der Leser (reader) · lesbar (readable) · vorlesen (to read aloud)"},
  {"n":"buch","de":"Ich lese ein Buch.","en":"I am reading a book.","lit":"I am reading a book.","gloss":"⟦das Buch, die Bücher⟧: book, books.","note":"","scene":"A woman reads on a train.","f":"Subject + verb + ein + noun","t":[]},
  {"n":"zeitung","de":"Ich lese die Zeitung.","en":"I read the newspaper.","lit":"I read the newspaper.","gloss":"⟦die Zeitung, die Zeitungen⟧: newspaper, newspapers.","note":"","scene":"A man at a cafe with a paper.","f":"Subject + verb + die + noun","t":[]},
  {"n":"pfeffer","de":"Salz und Pfeffer, bitte.","en":"Salt and pepper, please.","lit":"Salt and pepper, please.","gloss":"⟦der Pfeffer⟧: pepper (no plural).","note":"Pf at the start of a word is a quick p plus f, with no vowel between.","scene":"Two people share a small table with salt and pepper.","f":"Word pattern: sound shift p / pf","t":["pattern","sound shift"],"pat":"German pf often matches English p. ⟦Pfeffer⟧ pepper, ⟦Apfel⟧ apple, ⟦Pfund⟧ pound, ⟦Pfanne⟧ pan, ⟦Pfeife⟧ pipe, ⟦Pflanze⟧ plant. Say both sounds together: p-f. After this card, these count as known words."},
  {"n":"koche","de":"Ich koche gern.","en":"I like to cook.","lit":"I like to cook.","gloss":"⟦koche⟧: cook.","note":"","scene":"A woman at a stove.","f":"Subject + verb + gern","t":[],"fam":"kochen · der Koch · die Küche"},
  {"n":"musik","de":"Ich höre gern Musik.","en":"I like listening to music.","lit":"I like listening to music.","gloss":"⟦die Musik⟧: music (no plural).","note":"Stress the last syllable: mu-ZEEK, and the s sounds like z. ⟦Die Musik⟧ has no plural.","scene":"A woman with headphones.","f":"Subject + verb + gern + noun","t":["cognate"],"act":true},
  {"n":"kino","de":"Wir gehen ins Kino.","en":"We are going to the cinema.","lit":"We are going to the cinema.","gloss":"⟦das Kino, die Kinos⟧: cinema, cinemas.","note":"KEE-no, with a long first vowel. ⟦Das Kino⟧ is the cinema as a place, not the film. A film is ⟦der Film⟧.","scene":"A couple in front of a cinema.","f":"Subject + gehen + ins + noun","t":["cognate"],"act":true},
  {"n":"schreibe","de":"Ich schreibe dir später.","en":"I will write to you later.","lit":"I will write to you later.","gloss":"⟦schreibe⟧: write (with ⟦ich⟧).","note":"Future: present tense plus ⟦später⟧: ⟦Ich schreibe dir später⟧ = I will write to you later.","scene":"A man types on his phone.","f":"Subject + schreibe + dir + time","t":[],"fam":"schreiben · die Schrift · der Schreiber · schriftlich"},
  {"n":"öffnet","de":"Das Büro öffnet um zehn Uhr.","en":"The office opens at ten o'clock.","lit":"The office opens at ten o'clock.","gloss":"⟦öffnet⟧: opens.","note":"⟦Öffnen⟧ is open as a verb. ⟦Offen⟧ is the adjective.","scene":"A sign shows opening hours.","f":"Subject + öffnet + um + Uhrzeit","t":[],"fam":"öffnen · offen · die Öffnung · die Öffnungszeiten"},

function nextTopic(idx){for(var i=0;i<TOPICS.length;i++){var j=IDX[TOPICS[i][0]];if(j>idx)return {name:TOPICS[i][1],idx:j};}return null;}
function shelve(){
  if(!sess||!sess.cur||sess.offer)return;
  var c=sess.cur.c;
  S.cards[c.n]={st:"shelved",shelvedAt:now(),reps:0};
  sess.shelved++;sess.shelfRun++;sess.touched[c.n]=1;
  save();pickNext();
  if(!sess.cur){finish();return;}
  if(sess.shelfRun>=3&&sess.cur.kind==="new"){var tp=nextTopic(IDX[sess.cur.c.n]);if(tp)sess.offer=tp;}
  render();
}
function jumpTopic(){
  var o=sess.offer;if(!o)return;
  for(var i=0;i<o.idx;i++){if(!S.cards[CARDS[i].n])S.cards[CARDS[i].n]={st:"shelved",shelvedAt:now(),reps:0,sk:1};}
  sess.shelfRun=0;sess.offer=null;save();pickNext();
  if(!sess.cur){finish();return;}
  render();
}
function renderOffer(){
  var o=sess.offer;
  var h='<div class="stack" style="padding-top:4px"><div class="sess-top"><button class="link" data-act="quit">Finish</button><b id="clock" style="font-size:1.3rem;font-variant-numeric:tabular-nums">'+clock(Date.now()-sess.t0)+'</b><span style="width:48px"></span></div>';
  h+='<div class="card stack" style="text-align:center"><div class="eyebrow">Already know this?</div><h2 style="margin:0">You shelved '+sess.shelfRun+' cards in a row</h2><p class="muted" style="margin:0">Skip ahead to the next topic: <b>'+esc(o.name)+'</b>. The cards in between are shelved and count as learned, so later sentences can use them.</p><button class="btn good" data-act="jump">Skip to '+esc(o.name)+'</button><button class="link" data-act="stay">No, keep going here</button></div></div>';
  app.innerHTML=h;tabbar();
}
function answer(good){
  if(!sess||!sess.cur||!sess.shown||sess.offer)return;
  sess.shelfRun=0;
  var c=sess.cur.c,s=stateOf(c.n),isNew=!S.cards[c.n];
  var wasDue=!isNew&&s.due<=now();
  var n=plan(s,good);
  if(good&&s.st==="learn"&&n.st==="review"){n.learnedAt=now();}
  if(s.learnedAt&&!n.learnedAt)n.learnedAt=s.learnedAt;
  S.cards[c.n]=n;
  if(isNew){S.dayNew[dkey(now())]=newToday()+1;sess.newDone++;}else sess.rev++;
  if(good){sess.good++;if(sess.passed.indexOf(c.n)<0)sess.passed.push(c.n);}else sess.again++;
  sess.touched[c.n]=1;
  if(wasDue&&sess.cur.kind==="rev"){var k=dkey(now());var o=S.overdue[k]||{done:0};o.done++;S.overdue[k]=o;}
  save();
  pickNext();
  if(!sess.cur){finish();return;}
  render();
}
function finish(){
  if(timer){clearInterval(timer);timer=null;}
  var ms=Date.now()-sess.t0;
  S.studyMs+=ms;
  var rec={t:now(),day:dkey(now()),ms:ms,newN:sess.newDone,rev:sess.rev,good:sess.good,again:sess.again};
  S.log.push(rec);save();
  var tot=sess.good+sess.again;
  summary={ms:ms,newN:sess.newDone,rev:sess.rev,recall:tot?Math.round(100*sess.good/tot):100,idxBefore:sess.before,idxAfter:indexPct(),passed:sess.passed.slice(),learned:Object.keys(learnedSet()).length,left:CARDS.length-Object.keys(S.cards).length};
  sess=null;route="summary";render();
}
function quit(){if(timer){clearInterval(timer);timer=null;}if(sess){S.studyMs+=Date.now()-sess.t0;S.log.push({t:now(),day:dkey(now()),ms:Date.now()-sess.t0,newN:sess.newDone,rev:sess.rev,good:sess.good,again:sess.again});save();}sess=null;route="today";render();}

/* ---------- derived stats ---------- */
function streak(){
  var days={};S.log.forEach(function(r){days[r.day]=1;});
  var n=0,t=now();
  if(!days[dkey(t)])t-=DAY;
  while(days[dkey(t)]){n++;t-=DAY;}
  return n;
}
function weekMinutes(){
  var out=[],t=now();
  for(var i=6;i>=0;i--){var k=dkey(t-i*DAY),ms=0;S.log.forEach(function(r){if(r.day===k)ms+=r.ms;});
    var d=new Date(t-i*DAY);out.push({k:k,m:Math.round(ms/MIN),l:["S","M","T","W","T","F","S"][d.getDay()],today:i===0});}
  return out;
}
function completion30(){
  var done=0,t=now();for(var i=0;i<30;i++){var o=S.overdue[dkey(t-i*DAY)];if(o)done+=o.done;}
  var open=dueList().length;
  if(done+open===0)return null;
  return Math.round(100*done/(done+open));
}
function todayRevDone(){var o=S.overdue[dkey(now())];return o?o.done:0;}
function todayMs(){var k=dkey(now()),ms=0;S.log.forEach(function(r){if(r.day===k)ms+=r.ms;});return ms;}

}
function gl(s){return esc(s||"").replace(/\u27E6/g,'<span class="g" lang="de">').replace(/\u27E7/g,'</span>');}
function pic(c,small){

function nd(w){var lc=w.replace(/[.,?!]/g,"").toLowerCase();return (typeof NUMS!=="undefined"&&NUMS[lc]!==undefined)?'<sup class="nd">'+NUMS[lc]+'</sup>':"";}
function numw(w){var m=w.match(/^(.*?)([.,?!]*)$/);return esc(m[1])+nd(m[1])+esc(m[2]);}

function lineChart(){
  var W=520,H=220,L=36,R=14,T=14,B=30,UC=CARDS.filter(function(c){return !c.p;}),N=UC.length;
  function curve(order){var s={},arr=[0];order.forEach(function(c){ucards(c).forEach(function(u){s[u]=1;});arr.push(coverage(s));});return arr;}
  var path=curve(UC);
  var fo=UC.slice().sort(function(a,b){return rk(a)-rk(b);});
  var freq=curve(fo),M=TARGETS.length;
  function X(i){return L+(W-L-R)*i/N;}function Y(v){return T+(H-T-B)*(1-v/M);}
  function pts(a){return a.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1);}).join(" ");}
  var g="";
  [0,25,50,75,100].forEach(function(p){var y=Y(M*p/100);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+p+'%</text>';});
  [0,50,100,150,N].forEach(function(i){g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+i+'</text>';});
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Share of demo lines understood after each card, path order versus pure frequency order">'+g+
   '<polyline points="'+pts(freq)+'" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 4"/>'+
   '<polyline points="'+pts(path)+'" fill="none" stroke="var(--coral)" stroke-width="3.5"/>'+
   '<circle cx="'+X(N)+'" cy="'+Y(path[N])+'" r="4.5" fill="var(--coral)"/></svg>';
  return {svg:svg,a:path[20],b:freq[20]};
}

  h+='<p><b>'+learned+'</b> learned of '+total+'</p><p class="small muted">'+started+' cards seen, '+Math.round(S.studyMs/MIN)+' min studied.</p><p class="small muted" style="margin-top:6px">'+(left>0?'At '+S.set.goal+' new cards a day, '+days+' more day'+(days===1?'':'s')+' to start every card in this prototype. The real path will hold 1,000 words.':'Every card in this prototype has been started.')+'</p></div>';
  h+='<div class="card"><div class="eyebrow">Understanding Index</div><div class="big" style="margin:6px 0">'+indexPct()+'%</div><p class="small">You understand '+indexPct()+'% of the demo set of '+TARGETS.length+' everyday lines.</p><p class="small muted" style="margin-top:6px">A line counts once you have learned every word in it. In the real app the lines come from a weighted spoken-German sample, so the number tracks everyday speech.</p></div>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Current streak</div><b style="font-size:1.4rem">'+streak()+' day'+(streak()===1?"":"s")+'</b></div></div><div class="eyebrow" style="margin-top:14px">Minutes this week</div><svg viewBox="0 0 280 110" width="100%" role="img" aria-label="Minutes studied in the last seven days">';
  wk.forEach(function(d,i){var x=14+i*38,hgt=d.m?Math.max(6,Math.round(64*d.m/mx)):2;h+='<rect x="'+x+'" y="'+(78-hgt)+'" width="24" height="'+hgt+'" rx="6" fill="'+(d.m?"var(--coral)":"var(--line)")+'"/><text x="'+(x+12)+'" y="'+(70-hgt)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--navy)">'+(d.m?d.m:"")+'</text><text x="'+(x+12)+'" y="98" text-anchor="middle" font-size="11" fill="'+(d.today?"var(--navy)":"var(--muted)")+'" font-weight="'+(d.today?800:500)+'">'+d.l+'</text>';});
  h+='</svg><div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><span class="small muted">Share of due reviews you completed, 30 days</span><b>'+(comp===null?"No data yet":comp+"%")+'</b></div></div>';
  h+='<div class="card"><h2>Path map</h2><div class="grid" role="list">';
  CARDS.forEach(function(c){var s=stateOf(c.n).st;h+='<div role="listitem" class="cell '+(s==="review"?"r":s==="learn"?"l":"")+'" title="'+esc(c.de)+'"></div>';});
  h+='</div><div class="legend" style="margin-top:10px"><span><i style="background:var(--linen);border:1px solid var(--line);height:10px;width:10px;border-radius:3px"></i>Not started</span><span><i style="background:var(--coral-soft);border:1px solid var(--coral);height:10px;width:10px;border-radius:3px"></i>Learning</span><span><i style="background:var(--mint);border:1px solid var(--mint-ink);height:10px;width:10px;border-radius:3px"></i>Learned</span></div></div>';
  var rec=CARDS.filter(function(c){return stateOf(c.n).learnedAt;}).sort(function(a,b){return stateOf(b.n).learnedAt-stateOf(a.n).learnedAt;}).slice(0,6);
  h+='<div class="card"><h2>Recently learned</h2>'+(rec.length?rec.map(function(c){return '<div class="sw"><b>'+esc(lab(c))+'</b><span class="muted small" style="text-align:right">'+esc(c.en)+'</span></div>';}).join(""):'<p class="small muted">Cards appear here after you rate them Good a second time.</p>')+'</div></div>';
  return h;
}

function viewPath(){
  var ch=lineChart();
  var okN=0;CARDS.forEach(function(c,i){if(validate(i).ok)okN++;});
  var h='<div class="stack"><div><div class="eyebrow">Teacher view</div><h1>Path</h1></div>';
  h+='<div class="card stack"><h2 style="margin:0">Does the order make sentences?</h2><p class="small">Share of the '+TARGETS.length+' demo lines a learner could understand after each card. The line rises when a new word pairs with words already known.</p>'+ch.svg+'<div class="legend"><span><i style="background:var(--coral)"></i>Path order</span><span><i style="background:var(--muted)"></i>Pure frequency order</span></div><p class="small muted">After 20 cards: '+ch.a+' lines on this path, '+ch.b+' in pure frequency order. The demo lines were written for this deck, so this illustrates the metric and does not prove it. The real test needs a sample of real everyday sentences.</p></div>';
  h+='<div class="card stack"><h2 style="margin:0">Card check</h2><p class="small"><b>'+okN+' of '+CARDS.length+'</b> cards pass the rule: every word is already known except exactly one new item. The check runs live in this page.</p><p class="small muted">Review status is yours to set. Tap a status to cycle it: draft, approved, needs fix. A card should only reach students once a native speaker has approved it.</p></div>';
  h+='<div class="card scroll"><table><thead><tr><th>#</th><th>New item</th><th>Sentence</th><th>Frame</th><th>List</th><th>Rule</th><th>Status</th></tr></thead><tbody>';
  CARDS.forEach(function(c,i){
    var v=validate(i),st=S.rev[c.n]||"draft";
    h+='<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(lab(c))+'</b></td><td lang="de">'+esc(c.de)+'<div class="small muted">'+esc(c.en)+'</div></td><td class="small">'+esc(c.f)+'</td><td class="num">'+(c.p?'<span class="muted small">none</span>':'#'+rk(c)+'<div class="small">'+esc(UNITS[ucards(c)[0]].lemma)+'</div>')+'</td><td>'+(v.ok?'<span class="ok">1 new</span>':'<span class="no">'+(v.unk.length?'unknown: '+esc(v.unk.join(", ")):'new: '+esc(v.fresh.join(", ")))+'</span>')+'</td><td><button class="statebtn '+(st==="approved"?"approved":st==="fix"?"fix":"")+'" data-act="rev" data-id="'+esc(c.n)+'">'+(st==="fix"?"needs fix":st)+'</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

var cfilter="all";
function revOf(id){return S.rev[id]||"draft";}
function viewCards(){
  S.notes=S.notes||{};
  var cnt={draft:0,approved:0,fix:0};CARDS.forEach(function(c){cnt[revOf(c.n)]++;});
  var list=CARDS.filter(function(c){return cfilter==="all"||revOf(c.n)===cfilter;});
  function f(k,l,n){return '<button data-act="cfilter" data-v="'+k+'" aria-pressed="'+(cfilter===k)+'">'+l+' '+n+'</button>';}
  var h='<div class="stack"><div><div class="eyebrow">Teacher view</div><h1>All cards</h1></div>';
  h+='<div class="card stack"><p class="small">Read every card, then set a status and leave a note where something is off. Changes save at once in this browser. A card should only reach students once it is approved.</p>';
  h+='<div class="seg" role="group" aria-label="Filter">'+f("all","All",CARDS.length)+f("draft","Draft",cnt.draft)+f("approved","Approved",cnt.approved)+f("fix","Needs fix",cnt.fix)+'</div>';
  h+='<div class="row"><button class="btn small ghost" data-act="bulk" data-v="approved">Approve all shown ('+list.length+')</button><button class="btn small ghost" data-act="bulk" data-v="draft">Reset shown to draft</button><button class="btn small ghost" data-act="cexport">Show review as text</button></div>';
  if(S._cexp)h+='<textarea id="cexp" readonly aria-label="Review as text">'+esc(S._cexp)+'</textarea>';
  h+='</div>';
  if(!list.length)h+='<div class="card"><p class="small muted">No cards with this status.</p></div>';
  list.forEach(function(c){
    var i=IDX[c.n],st=revOf(c.n),v=validate(i);
    h+='<div class="card stack rc"><div class="row" style="justify-content:space-between"><span class="chip">#'+(i+1)+(c.p?' practice, no new word':' new: '+esc(lab(c)))+'</span><button class="btn small ghost" data-act="cplay" data-id="'+esc(c.n)+'" aria-label="Play audio">Play</button></div>';
    h+='<div lang="de" class="rcde">'+dehtml(c.de)+'</div><div>'+esc(c.en)+'</div>';
    h+='<div class="small muted">Literal: '+esc(c.lit)+'</div><div class="small">'+esc(c.gloss)+'</div>';
    if(c.note)h+='<div class="small muted">Note: '+gl(c.note)+'</div>';
    h+='<div class="small muted">Scene: '+esc(c.scene)+'</div>';
    h+='<div class="small muted">Frame: '+esc(c.f)+' &middot; '+(v.ok?'rule ok':'rule: '+(v.unk.length?'unknown '+esc(v.unk.join(", ")):'new '+esc(v.fresh.join(", "))))+'</div>';
    h+='<div class="seg" role="group" aria-label="Status of '+esc(c.n)+'">'+[["approved","Approved"],["fix","Needs fix"],["draft","Draft"]].map(function(o){return '<button data-act="setrev" data-id="'+esc(c.n)+'" data-v="'+o[0]+'" aria-pressed="'+(st===o[0])+'">'+o[1]+'</button>';}).join("")+'</div>';
    h+='<textarea class="cnote" data-id="'+esc(c.n)+'" rows="2" placeholder="Note or better wording (optional)" aria-label="Note for '+esc(c.n)+'">'+esc(S.notes[c.n]||"")+'</textarea></div>';
  });
  return h+'</div>';
}

function voiceRow(){
  var r=rankedVoices(),cur=pickVoice();
  if(!("speechSynthesis" in window))return '<div class="sw"><div class="grow"><b>German voice</b><div class="small muted">This browser has no speech voices. Try Chrome, Edge or Safari.</div></div></div>';
  if(!r.length)return '<div class="sw"><div class="grow"><b>German voice</b><div class="small muted">No German voice found on this device yet. On iPhone: Settings, Accessibility, Spoken Content, Voices, German, and download an Enhanced or Premium voice. On Android: Settings, System, Languages, Text-to-speech, install German voice data. On a computer, Microsoft Edge has the most natural German voices built in.</div></div></div>';
  var opts=r.map(function(v,i){return '<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')'+(i===0&&!S.set.voice?" - recommended":"")+'</option>';}).join("");
  var weak=vScore(r[0])<20;
  return '<div class="sw" style="align-items:flex-start"><div class="grow"><b>German voice</b><div class="small muted">Pick the voice that sounds best to you, then test it.'+(weak?' The voices on this device are basic. For a much more natural sound, try Microsoft Edge, or download an Enhanced voice in your system settings.':'')+'</div></div><div class="stack" style="gap:8px;min-width:0;max-width:55%"><select id="voicesel" aria-label="German voice" style="width:100%;min-height:40px;font:inherit">'+opts+'</select><button class="btn small ghost" data-act="vtest">Test voice</button></div></div>';
}
function viewSettings(){
  var s=S.set;
  function seg(name,vals,cur,lab){return '<div class="seg" role="group" aria-label="'+name+'">'+vals.map(function(v){return '<button data-act="set" data-k="'+name+'" data-v="'+v+'" aria-pressed="'+(String(cur)===String(v))+'">'+(lab?lab(v):v)+'</button>';}).join("")+'</div>';}
  function sw(k,label,desc){return '<div class="sw"><div class="grow"><b>'+label+'</b><div class="small muted">'+desc+'</div></div><button class="statebtn '+(s[k]?"approved":"")+'" data-act="toggle" data-k="'+k+'" aria-pressed="'+(!!s[k])+'" style="min-width:56px;min-height:36px">'+(s[k]?"On":"Off")+'</button></div>';}
  var h='<div class="stack"><div><div class="eyebrow">Account</div><h1>Settings</h1></div>';
  h+='<div class="card"><div class="sw"><div class="grow"><b>New cards a day</b><div class="small muted">Reviews come first, then new cards up to this number.</div></div>'+seg("goal",[5,10,20],s.goal)+'</div><div class="sw"><div class="grow"><b>Audio speed</b><div class="small muted">Playback rate of the German voice.</div></div>'+seg("speed",[0.7,0.85,1],s.speed,function(v){return v+"x";})+'</div>'+voiceRow()+
    sw("hide","Hide the text","Cover the sentence until you reveal. The audio plays either way.")+sw("auto","Play audio automatically","The sentence plays when a card appears.")+sw("next","Show next review time","Show when each rating would bring a card back.")+'</div>';
  h+='<div class="card stack"><h2 style="margin:0">Demo controls</h2><p class="small muted">Reviews are scheduled in days, so use this to see them come back. The clock is shifted by '+Math.round(S.offset/DAY)+' day'+(Math.round(S.offset/DAY)===1?"":"s")+'.</p><div class="row"><button class="btn small" data-act="skip">Skip ahead 1 day</button><button class="btn small ghost" data-act="skipback">Reset clock</button></div></div>';
  h+='<div class="card stack"><h2 style="margin:0">Your data</h2><p class="small muted">Progress is saved in this browser only. Clearing site data or switching device starts you at the beginning. The real app will sync to your account.</p><div class="row"><button class="btn small ghost" data-act="export">Show progress as text</button>'+(S._confirm?'<button class="btn small" data-act="resetyes">Yes, erase everything</button><button class="btn small ghost" data-act="resetno">Cancel</button>':'<button class="btn small ghost" data-act="reset">Reset all progress</button>')+'</div>'+(S._export?'<textarea id="exp" readonly aria-label="Progress data">'+esc(S._export)+'</textarea>':"")+'</div></div>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener("change",function(e){var t=e.target;if(t&&t.id==="voicesel"){S.set.voice=t.value;save();speak("Guten Tag! Schön, dich zu sehen. Wie geht es dir heute?");}});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="tab"){if(sess)return;route=b.getAttribute("data-to");summary=route==="summary"?summary:summary;delete S._export;delete S._cexp;S._confirm=false;render();}
  else if(a==="begin"){var pw=document.getElementById("portal");if(pw&&pw.classList){pw.classList.add("open");b.disabled=true;}var rm=false;try{rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}setTimeout(startSession,rm?0:850);}
  else if(a==="show"){if(sess){sess.shown=true;renderSession();}}
  else if(a==="again")answer(false);
  else if(a==="shelve")shelve();
  else if(a==="jump")jumpTopic();
  else if(a==="stay"){sess.offer=null;sess.shelfRun=0;render();}
  else if(a==="unshelve"){Object.keys(S.cards).forEach(function(k){if(S.cards[k].st==="shelved")delete S.cards[k];});save();render();}
  else if(a==="good")answer(true);
  else if(a==="speak"){if(sess&&sess.cur&&!speak(sess.cur.c.de)){b.textContent="No voice on this device";}}
  else if(a==="quit")quit();
  else if(a==="shadow"){shadow={q:summary.passed.slice(),i:0,r:0,show:false};route="shadow";render();setTimeout(function(){speak(CARDS[IDX[shadow.q[0]]].de);},250);}
  else if(a==="shadowplay"){speak(CARDS[IDX[shadow.q[shadow.i]]].de);}
  else if(a==="shadowtext"){shadow.show=!shadow.show;renderShadow();}
  else if(a==="shadownext"){
    if(shadow.r<2){shadow.r++;}
    else if(shadow.i<shadow.q.length-1){shadow.i++;shadow.r=0;shadow.show=false;}
    else{route="today";shadow=null;render();return;}
    renderShadow();setTimeout(function(){speak(CARDS[IDX[shadow.q[shadow.i]]].de);},200);
  }
  else if(a==="shadowquit"){route="today";shadow=null;render();}
  else if(a==="rev"){var id=b.getAttribute("data-id"),cur=S.rev[id]||"draft";S.rev[id]=cur==="draft"?"approved":cur==="approved"?"fix":"draft";save();var y=window.scrollY;render();window.scrollTo(0,y);}
  else if(a==="cfilter"){cfilter=b.getAttribute("data-v");render();}
  else if(a==="setrev"){S.rev[b.getAttribute("data-id")]=b.getAttribute("data-v");save();var y2=window.scrollY;render();window.scrollTo(0,y2);}
  else if(a==="bulk"){var vv=b.getAttribute("data-v");CARDS.forEach(function(c){if(cfilter==="all"||revOf(c.n)===cfilter)S.rev[c.n]=vv;});save();render();}
  else if(a==="cplay"){var cc=CARDS[IDX[b.getAttribute("data-id")]];if(!speak(cc.de))b.textContent="No voice on this device";}
  else if(a==="cexport"){S.notes=S.notes||{};S._cexp=CARDS.map(function(c,i){return (i+1)+". ["+(revOf(c.n)==="fix"?"needs fix":revOf(c.n))+"] "+c.de+" / "+c.en+(S.notes[c.n]?"\n   Note: "+S.notes[c.n]:"");}).join("\n");render();}
  else if(a==="vtest"){speak("Guten Tag! Schön, dich zu sehen. Wie geht es dir heute?");}
  else if(a==="set"){var k=b.getAttribute("data-k"),v=parseFloat(b.getAttribute("data-v"));S.set[k]=v;save();render();}
  else if(a==="toggle"){var k2=b.getAttribute("data-k");S.set[k2]=!S.set[k2];save();render();}
  else if(a==="skip"){S.offset+=DAY;save();render();}
  else if(a==="skipback"){S.offset=0;save();render();}
  else if(a==="export"){S._export=JSON.stringify({cards:S.cards,log:S.log,set:S.set,rev:S.rev},null,1);render();}
  else if(a==="reset"){S._confirm=true;render();}
  else if(a==="resetno"){S._confirm=false;render();}
  else if(a==="resetyes"){S=fresh();save();route="today";render();}
});
document.addEventListener("input",function(e){
  var t=e.target;if(t&&t.classList&&t.classList.contains("cnote")){S.notes=S.notes||{};var id=t.getAttribute("data-id");if(t.value)S.notes[id]=t.value;else delete S.notes[id];save();}
});
document.addEventListener("keydown",function(e){
  if(route!=="session"||!sess||e.metaKey||e.ctrlKey)return;
  if(e.code==="Space"){e.preventDefault();if(!sess.shown){sess.shown=true;renderSession();}}
  else if(e.key==="1")answer(false);
  else if(e.key==="2")answer(true);
  else if(e.key==="3")shelve();
});
window.addEventListener("pagehide",function(){if(sess)save();});
render();
})();
</script>

</body>
