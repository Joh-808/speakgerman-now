<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Click-through German role-play missions for absolute beginners: cash machine, supermarket checkout, ticket machine, online shop and parcel locker. From Speak German - now.">
<meta name="theme-color" content="#F3EBDF">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>Missions · Speak German - now.</title>
<style>
:root{
  --navy:#0E172D; --coral:#F66F54; --mint:#BCDDBF; --mint-icon:#5E9A6A; --sand:#F3EBDF; --cream:#EEE5DA; --linen:#ECE0D1; --muted:#4A5266; --gold:#D9A441;
  --bg:#F3EBDF; --fg:#0E172D; --card:#EEE5DA; --line:#ECE0D1; --line-strong:#CDBFAA; --sub:#4A5266;
  --btn:#F66F54; --btn-fg:#0E172D; --shadow:#0E172D; --keyc:#0E172D; --keyo:#5E9A6A;
  --good-bg:#DCEEDD; --good-fg:#1D4A29; --ok-bg:#F7E9C2; --ok-fg:#5A4310; --bad-bg:#FBDFD7; --bad-fg:#86281A;
  --dev:#39404F; --dev-hi:#5A6378; --dev-lo:#232833; --scr:#0F2A52; --scr-fg:#EAF2FF; --scr-line:#5B86C4; --scr-amber:#FFD34E; --scr-warn:#7A1F12;
  --wall:#E4D8C6; --belt:#4B5263; --floor:#D9CCB7; --shelf:#B79F82; --lcd:#0C1F13; --lcd-fg:#7CF5A0; --paper:#FFFDF6; --ink:#222;
  --ring:#1F6FEB;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1223; --fg:#F3EBDF; --card:#16213B; --line:#26345A; --line-strong:#3A4B78; --sub:#B3BBCC;
  --btn:#F66F54; --btn-fg:#0E172D; --shadow:#04070E; --keyc:#F3EBDF; --keyo:#8CCB98;
  --good-bg:#17382A; --good-fg:#BFE8C8; --ok-bg:#3B3216; --ok-fg:#F0DDA0; --bad-bg:#4A2019; --bad-fg:#FFB8A8;
  --wall:#1E2A47; --floor:#2A3556; --shelf:#4C5A80; --paper:#F4EFE2; --ring:#8AB4FF; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B1223; --fg:#F3EBDF; --card:#16213B; --line:#26345A; --line-strong:#3A4B78; --sub:#B3BBCC;
  --btn:#F66F54; --btn-fg:#0E172D; --shadow:#04070E; --keyc:#F3EBDF; --keyo:#8CCB98;
  --good-bg:#17382A; --good-fg:#BFE8C8; --ok-bg:#3B3216; --ok-fg:#F0DDA0; --bad-bg:#4A2019; --bad-fg:#FFB8A8;
  --wall:#1E2A47; --floor:#2A3556; --shelf:#4C5A80; --paper:#F4EFE2; --ring:#8AB4FF; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,7vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:22px;font-weight:800;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
svg{display:block}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.brand svg{width:24px;height:24px;color:var(--keyc)}
.brand em{font-style:normal;color:var(--coral)}
h1{color:var(--coral)}
.lead{color:var(--sub);max-width:60ch}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-strong)}
.flag{width:18px;height:12px;border-radius:2px;overflow:hidden}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;font-size:14px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{background:var(--btn);color:var(--btn-fg);border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 0 var(--shadow);transition:transform .08s,box-shadow .08s;align-self:flex-start}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--fg);box-shadow:none;padding:10px 16px;font-size:15px}
.btn.ghost:active{transform:none;opacity:.7}
.btn:disabled{opacity:.4;cursor:default}
.atm.m-ticket{background:linear-gradient(180deg,#4a6ba3,#2f4a78 25%,#1c2c47);border-color:#0e1626}
.atm.m-locker{background:linear-gradient(180deg,#f4c900,#e0b400 30%,#b88f00);color:#2b2200;border-color:#6b5300}
.atm.m-locker .atm-head{color:#3a2d00}
.atm-body.one{grid-template-columns:1fr}
.lockers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lk{height:46px;border-radius:5px;background:#8a6b00;border:2px solid #5a4500;color:#fff2b8;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.lk.glow{border-color:#fff;background:#fff2b8;color:#2b2200;animation:pulse 1.2s ease-in-out infinite}
.lk.open{background:#2b2200;color:#ffd34e;border-color:#fff}
@media(prefers-reduced-motion:reduce){.lk.glow{animation:none}}
.platform{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.gsign{background:#0b5fa5;color:#fff;font-weight:800;border-radius:6px;padding:8px 12px}
.entw{background:#f2c300;color:#2b2200;border-radius:10px;border:3px solid #6b5300;padding:8px 12px;font-weight:800;text-align:center;font-size:12px;letter-spacing:.08em}
.entw i{display:block;height:8px;border-radius:4px;background:#2b2200;margin:6px 0}
.tkt{background:var(--paper);color:var(--ink);border-radius:8px;border:1px dashed #777;padding:10px 12px;font-size:13px;flex:1 1 220px;display:flex;flex-direction:column;gap:2px}
.stamps{display:flex;gap:6px;margin-top:6px}
.stamps span{flex:1;min-height:40px;border:1.5px solid #888;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#b00020;text-align:center;line-height:1.1}
.browser{background:#d9dde6;border-radius:14px;border:1px solid var(--line-strong);overflow:hidden}
.urlbar{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:13px;color:#2a2f3a;background:#eceff5;min-width:0}
.urlbar svg{width:14px;height:14px;flex:none;color:#2a7a4b}
.urlbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{background:#fff;color:#1b1f2a;padding:14px;display:flex;flex-direction:column;gap:10px}
.page .gl{color:#5b6475}
.shop-h{font-weight:900;letter-spacing:.14em;font-size:15px;border-bottom:2px solid #1b1f2a;padding-bottom:8px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8a92a3}
.crumbs .on{color:#1b5e3b;text-decoration:underline}.crumbs .done{color:#1b1f2a}
.wh{font-size:18px;margin:0}
.wrow{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;border-bottom:1px solid #e3e6ee;padding-bottom:6px}
.wrow>div{min-width:0}
.wrow.tot{font-size:18px;font-weight:800;border-bottom:0}
.wp{font-size:13px;margin:0;color:#3a4152}
.wchk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.wchk i{width:18px;height:18px;border:2px solid #1b1f2a;border-radius:3px;flex:none;margin-top:2px}
.wchk i.on{background:#1b5e3b;border-color:#1b5e3b;box-shadow:inset 0 0 0 3px #fff}
.waddr{font-size:15px;background:#f3f5f9;border-radius:6px;padding:10px}
.web-opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.web-opts.sizes{display:grid;grid-template-columns:repeat(4,1fr)}
.web-opts.sizes .spk{display:none}
.wopt .opt{background:#fff;color:#1b1f2a;border:1.5px solid #9aa3b5;border-radius:6px;padding:12px;align-items:center;text-align:center}
.wopt.pri .opt{background:#1b5e3b;color:#fff;border-color:#1b5e3b}
.wopt .spk{color:#1b1f2a;border-color:#9aa3b5;border-radius:6px;width:38px}
.wopt.pri .spk{color:#1b5e3b;border-color:#1b5e3b}
.web-opts.radio .opt{flex-direction:row;text-align:left;align-items:center;gap:10px}
.web-opts.radio .opt .de{display:block}
.web-opts.radio .opt::before{content:"";width:16px;height:16px;border:2px solid #1b1f2a;border-radius:50%;flex:none}
.wstatic{border:1.5px solid #9aa3b5;border-radius:6px;padding:10px;text-align:center;font-weight:800;min-width:0}
.wstatic.chosen{border-color:#F66F54;background:#fff3ef}

.sign .opt.static{cursor:default}
.sign .opt.chosen{outline-color:var(--coral);border-color:var(--coral)}
.olist{display:flex;flex-direction:column;gap:4px;font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.35)}
.olist span{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.olist .me{font-weight:800}
.olist .me::after{content:" \2190 you"}

/* dashboard */
.tiles{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line-strong);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;color:var(--fg);box-shadow:0 6px 0 var(--line-strong);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line-strong)}
.tile .ill{height:96px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.tile .ill svg{height:76px;width:auto}
.tile h2{font-size:24px}
.tile .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.tile p{color:var(--sub);font-size:15px}
.tile .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;font-weight:800}
.tile .foot svg{width:30px;height:30px}
.tile.soon{background:transparent;border-style:dashed;box-shadow:none;cursor:default;opacity:.75}
.tile.soon:active{transform:none}
.key-done{color:var(--keyo)} .key-todo{color:var(--keyc)}

/* mission chrome */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--coral);border-radius:99px;transition:width .3s}
.goal{background:var(--card);border:1px solid var(--line-strong);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.goal svg{width:28px;height:28px;flex:none;color:var(--keyc)}
.goal b{display:block}
.goal span{color:var(--sub);font-size:14px}
.narr{border-left:5px solid var(--coral);padding:4px 0 4px 14px}
.narr .task{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.narr p{font-size:17px}

.optw{display:flex;gap:6px;align-items:stretch;min-width:0}
.opt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 14px}
.opt .de{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.gl{display:block;font-size:13px;font-weight:500;opacity:.8}
.spk{flex:none;width:44px;border-radius:14px;border:1.5px solid currentColor;background:transparent;display:flex;align-items:center;justify-content:center;opacity:.85}
.spk svg{width:20px;height:20px}
.tray{display:flex;flex-direction:column;gap:10px}
.tray .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.tray .opt,.say-opt .opt{background:var(--card);border:2px solid var(--fg);box-shadow:0 4px 0 var(--fg);transition:transform .08s,box-shadow .08s}
.tray .opt:active,.say-opt .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fg)}
.tray .spk,.say-opt .spk{color:var(--fg);border-color:var(--fg)}

/* feedback */
.fb{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-bg);color:var(--good-fg)} .fb.ok{background:var(--ok-bg);color:var(--ok-fg)} .fb.bad{background:var(--bad-bg);color:var(--bad-fg)}
.fb .h{display:flex;align-items:center;gap:8px;font-size:18px}
.fb .h svg{width:24px;height:24px;flex:none}
.fb .picked{font-size:14px;opacity:.85}
.fb .btn{box-shadow:0 6px 0 var(--shadow)}

/* ATM */
.atm{background:linear-gradient(180deg,var(--dev-hi),var(--dev) 18%,var(--dev-lo));border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;border:2px solid #11151d;box-shadow:0 8px 0 rgba(0,0,0,.25);color:#E7EAF2}
.atm-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.2em;color:#C9CFDD}
.atm-head .euro{background:#1c4fa3;color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:0}
.screen{background:var(--scr);color:var(--scr-fg);border-radius:10px;border:6px solid #11151d;padding:14px;min-height:190px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.screen.warn{background:var(--scr-warn)}
.scr-t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--scr-amber);border-bottom:1px solid var(--scr-line);padding-bottom:6px}
.scr-l{font-size:18px;font-weight:600}
.scr-l .gl{color:#BBD0F2;font-size:13px}
.scr-ic{display:flex;gap:14px;align-items:center;color:var(--scr-amber);padding-block:4px}
.scr-ic svg{width:44px;height:44px}
.pin{display:flex;gap:10px;justify-content:center;font-size:34px;font-weight:800;letter-spacing:.1em;padding-block:6px;font-variant-numeric:tabular-nums;color:var(--scr-amber)}
.pin i{font-style:normal;width:28px;text-align:center;border-bottom:3px solid var(--scr-line)}
.hint{font-size:14px;color:var(--scr-amber);text-align:center;min-height:20px}
.scr-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px}
.scr-opts.two{grid-template-columns:1fr 1fr}
@media(max-width:420px){.scr-opts.two{grid-template-columns:1fr}}
.sk .opt{background:#16427D;border:1.5px solid var(--scr-line);color:#fff;border-radius:6px;padding:10px 12px}
.sk .opt::before{content:"\25B8";color:var(--scr-amber);position:absolute;margin-left:-2px;display:none}
.sk .opt .de{font-size:17px}
.sk .opt:active{background:#1d5aa8}
.sk .spk{color:#fff;border-color:var(--scr-line);border-radius:6px;width:38px}
.atm-body{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.atm-body{grid-template-columns:1fr}}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypad button{border:0;border-radius:8px;padding:12px 0;font-weight:800;font-size:18px;background:#C9CFDB;color:#161a22;box-shadow:0 3px 0 #101319;min-width:0}
.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 #101319}
.keypad button:disabled{opacity:.4;cursor:default}
.keypad .k-ok{background:#2FA75A;color:#fff;grid-column:4;grid-row:2/3}
.keypad .k-fix{background:#E6B800;grid-column:4;grid-row:3/4}
.keypad .k-no{background:#D6382B;color:#fff;grid-column:4;grid-row:1/2}
.keypad .zero{grid-column:2}
.keypad .k-ok,.keypad .k-fix,.keypad .k-no{font-size:11px;letter-spacing:.02em;padding:6px 2px;line-height:1.1}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{background:#0b0d12;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9AA3B8;border:2px solid #1b1f29}
.slot svg{width:26px;height:26px}
.slot .bar-s{flex:1;height:8px;border-radius:4px;background:#252a36}
.slot.glow{border-color:var(--scr-amber);color:var(--scr-amber);animation:pulse 1.2s ease-in-out infinite}
.slot.glow .bar-s{background:var(--scr-amber)}
@keyframes pulse{50%{box-shadow:0 0 14px 2px rgba(255,211,78,.6)}}
@media(prefers-reduced-motion:reduce){.slot.glow{animation:none}.fill{transition:none}}

/* store */
.floor{background:var(--floor);border-radius:22px;border:1px solid var(--line-strong);padding:14px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:34px 10px;padding-top:6px}
.sign{position:relative;min-width:0}
.sign::before{content:"";position:absolute;left:50%;top:-22px;height:22px;border-left:2px solid var(--fg);opacity:.5}
.sign .opt{background:#12356E;color:#fff;border:2px solid #fff;outline:2px solid #12356E;border-radius:8px;align-items:center;text-align:center;padding:12px 8px}
.sign .opt .de{font-size:19px;overflow-wrap:normal}
@media(max-width:480px){.signs{grid-template-columns:1fr}}
.sign .spk{color:#fff;background:#12356E;border-color:#fff;border-radius:8px;width:36px}
.shelves{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shelf{height:56px;border-radius:6px;background:var(--shelf);position:relative;overflow:hidden}
.shelf::after{content:"";position:absolute;inset:8px 6px auto;height:10px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--coral) 0 14px,var(--mint) 14px 28px,var(--gold) 28px 42px,transparent 42px 46px);opacity:.9}
.shelf::before{content:"";position:absolute;inset:30px 6px auto;height:10px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--mint-icon) 0 18px,var(--cream) 18px 34px,var(--coral) 34px 48px,transparent 48px 52px);opacity:.85}
.you{font-size:13px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:8px}
.you svg{width:26px;height:26px}
.shop{background:var(--wall);border:1px solid var(--line-strong);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.cashier{display:flex;gap:10px;align-items:flex-start}
.cashier svg.av{width:64px;height:64px;flex:none}
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;flex:1;min-width:0;border:2px solid var(--ink)}
.bubble::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble .de{font-weight:700;font-size:18px}
.bubble .gl{color:#444}
.bubble .spk{color:var(--ink);width:34px;height:34px;border-radius:50%;float:right;margin-left:8px}
.counter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
@media(max-width:420px){.counter{grid-template-columns:1fr}}
.belt{background:var(--belt);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:92px;border-bottom:8px solid #2e3340}
.item{background:var(--paper);color:var(--ink);font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;display:inline-flex;gap:6px;font-variant-numeric:tabular-nums}
.item.bagi{background:var(--mint)}
.till{display:flex;flex-direction:column;gap:8px;min-width:150px}
.lcd{background:var(--lcd);color:var(--lcd-fg);font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:8px;padding:8px 12px;border:3px solid #111;font-size:13px;font-variant-numeric:tabular-nums}
.lcd b{display:block;font-size:24px}
.term{display:flex;align-items:center;gap:8px;background:#2a2f3a;border-radius:8px;padding:8px;color:#cfd5e3}
.term svg{width:28px;height:28px;flex:none}
.term .nb{background:var(--paper);color:var(--ink);font-weight:800;font-size:11px;line-height:1.1;padding:4px 6px;border:2px solid #C0392B;border-radius:4px;text-transform:uppercase}
.drawer{background:#2a2f3a;border-radius:8px;padding:8px;color:#cfd5e3;font-size:13px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.drawer b{color:var(--lcd-fg)}
.say-wrap{display:flex;flex-direction:column;gap:10px}
.say-wrap .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}

/* receipts / debrief */
.bon{background:var(--paper);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:14px;max-width:300px;border-radius:2px;box-shadow:0 4px 0 var(--line-strong);align-self:center;width:100%}
.bon div{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.bon hr{border:0;border-top:1px dashed #777;margin:6px 0}
.deb{background:var(--card);border:1px solid var(--line-strong);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.deb .big{display:flex;align-items:center;gap:12px}
.deb .big svg{width:48px;height:48px}
.vocab{display:flex;flex-wrap:wrap;gap:8px}
.vocab button{border:1.5px solid var(--fg);background:transparent;border-radius:12px;padding:6px 10px;text-align:left;font-weight:800;font-size:15px}
.vocab button .gl{font-weight:500}
.cost{background:var(--bad-bg);color:var(--bad-fg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.cost b{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:13px;color:var(--sub)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
</style>

var CAN_SPEAK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);

/* ---------- speech ---------- */
function speak(t){
  if(!CAN_SPEAK||!t)return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;
    var v=(window.speechSynthesis.getVoices()||[]).filter(function(x){return /^de/i.test(x.lang)})[0];
    if(v)u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

  opts:[{de:'Fach öffnen',en:'Open compartment',k:'good',fb:{b:'"öffnen" is open. Watch for the glowing door.'}},
        {de:'Abbrechen',en:'Cancel',k:'bad',fb:{t:'Cancelled',b:'You leave without the parcel. It stays in the locker for a limited time only.'}}]},
 {task:'Take it',narr:'A door clicks open and a light blinks. Look at the lockers.',zone:'fach',open:1,say:'Bitte entnehmen Sie Ihre Sendung',
  screen:{t:'Fach 27',l:[['Das Fach ist geöffnet.','The compartment is open.'],['Bitte entnehmen Sie Ihre Sendung.','Please take your parcel.']]},
  opts:[{de:'Fach schließen',en:'Close compartment',k:'bad',fb:{t:'Parcel still inside',b:'You closed the door with the parcel still inside. You would have to start over.'}},
        {de:'Sendung entnehmen',en:'Take the parcel',k:'good',fb:{b:'"entnehmen" again: take something out. Same word as at the cash machine.'}}]},
 {task:'Close',narr:'You hold the parcel. The door is still open.',zone:'fach',open:1,say:'Bitte schließen Sie das Fach',
  screen:{t:'Fach 27',l:[['Bitte schließen Sie das Fach.','Please close the compartment.']]},
  opts:[{de:'Weggehen',en:'Walk away',k:'bad',fb:{t:'Door left open',b:'An open compartment blocks the machine and the next person has to wait.'}},
        {de:'Fach schließen',en:'Close compartment',k:'good',fb:{t:'Mission complete',b:'Parcel in your hands, door closed. Nothing left behind.'}}]}
 ]
};
var MISSIONS=[ATM,KASSE,TICKET,ONLINE,LOCKER];

/* ---------- state ---------- */
var G=null,app=document.getElementById('app');
function cp(o){return JSON.parse(JSON.stringify(o))}
function stepOf(i){var s=G.m.steps[i];return typeof s==='function'?s(G):s}
function start(id){
  var m=MISSIONS.filter(function(x){return x.id===id})[0];
  G={m:m,idx:0,pin:'',fb:null,hint:'',mist:0,bad:{},right:{},fin:false,st:m.init?m.init():{},snap:[]};
  G.snap[0]=cp(G.st);
  render();window.scrollTo(0,0);
}
function home(){G=null;render();window.scrollTo(0,0)}

/* ---------- renderers ---------- */
function header(){
  return '<div class="brand">'+KEY_O+'<span>Speak German <em>- now.</em></span></div>';
}
function toolsHTML(){
  return CAN_SPEAK?'<div class="tools"><button class="tog" data-tog="snd" aria-pressed="'+prefs.snd+'">Read aloud on tap</button></div>':'';
}
function dashboard(){
  var h=header()+'<div><span class="chip">'+FLAG+'Germany</span></div><h1>Everyday Missions</h1>'+
   '<p class="lead">Real situations, real screens, real words. Inside every mission everything is in German, just like in real life, so at first you have to guess. Pick an answer, then see the translation and what happens. Use Back to try the other option.</p>'+toolsHTML()+'<div class="tiles">';
  MISSIONS.forEach(function(m){
    var d=done[m.id];
    h+='<button class="tile" data-start="'+m.id+'"><div class="ill">'+I[m.ill]+'</div><span class="tag">'+m.tag+'</span><h2>'+m.title+'</h2><p>'+m.blurb+'</p><div class="foot"><span>'+(d?'Play again':'Start')+'</span><span class="'+(d?'key-done':'key-todo')+'">'+(d?KEY_O:KEY_C)+'</span></div></button>';
  });
  ['Parking meter','Laptop reset'].forEach(function(n){
    h+='<div class="tile soon"><div class="ill">'+I.soonIll+'</div><span class="tag">Soon</span><h2>'+n+'</h2></div>';
  });
  return h+'</div>';
}
function iconRow(ic){return ic?'<div class="scr-ic">'+ic.map(function(x){return I[x]}).join('')+'</div>':''}
function screenHTML(step,inScreenOpts){
  var sc=step.screen,f=G.fb&&G.fb.o.fb&&G.fb.o.fb.screen;
  var showOpts=!G.fb&&inScreenOpts;
  if(f)sc=f;
  var h='<div class="screen'+(sc.warn?' warn':'')+'"><div class="scr-t"><span>'+sc.t+'</span>'+((!f&&step.say)?spk(step.say):'')+'</div>';
  (sc.l||[]).forEach(function(l){h+='<div class="scr-l">'+l[0]+gl(l[1])+'</div>'});
  if(!f)h+=iconRow(sc.ic);
  if(sc.pin&&!f){
    var d='';for(var i=0;i<4;i++)d+='<i>•</i>';
    h+='<div class="pin" aria-label="PIN">'+d+'</div><div class="hint">'+G.hint+'</div>';
  }
  if(showOpts){
    h+='<div class="scr-opts'+(step.two&&step.opts.length>2?' two':'')+'">'+step.opts.map(function(o,i){return opt(o,i,'sk')}).join('')+'</div>';
  }
  return h+'</div>';
}
function machineScene(step){
  var cfg=G.m.machine;
  var inScreen=!step.zone&&!step.type&&!step.info;
  var z=(!G.fb)?step.zone:'';
  var keys='';
  if(cfg.pad){
    ['1','2','3'].forEach(function(n){keys+='<button data-d="'+n+'" disabled>'+n+'</button>'});
    keys+='<button class="k-no" disabled>Abbrechen</button>';
    ['4','5','6'].forEach(function(n){keys+='<button data-d="'+n+'" disabled>'+n+'</button>'});
    keys+='<button class="k-ok" disabled>Bestätigen</button>';
    ['7','8','9'].forEach(function(n){keys+='<button data-d="'+n+'" disabled>'+n+'</button>'});
    keys+='<button class="k-fix" disabled>Korrektur</button><button class="zero" data-d="0" disabled>0</button>';
  }
  var slots=(cfg.slots||[]).map(function(x){return '<div class="slot'+(z===x[0]?' glow':'')+'">'+I[x[2]]+'<span>'+x[1]+'</span><span class="bar-s"></span></div>'}).join('');
  var body='';
  if(cfg.pad||slots)body='<div class="atm-body'+(cfg.pad?'':' one')+'">'+(cfg.pad?'<div class="keypad">'+keys+'</div>':'')+(slots?'<div class="slots">'+slots+'</div>':'')+'</div>';
  var lock='';
  if(cfg.lockers){
    lock='<div class="lockers">';
    for(var n=21;n<=32;n++)lock+='<div class="lk'+(n===27&&step.open?' open':'')+(n===27&&z==='fach'?' glow':'')+'">'+n+'</div>';
    lock+='</div>';
  }
  return '<div class="atm m-'+G.m.id+'" role="group" aria-label="'+cfg.head+'"><div class="atm-head"><span>'+cfg.head+'</span>'+(cfg.badge?'<span class="euro">'+cfg.badge+'</span>':'')+'</div>'+screenHTML(step,inScreen)+body+lock+'</div>';
}
function ticketHTML(stamped){
  return '<div class="tkt"><b>STADTVERKEHR MUSTER</b><span>4er-Ticket · Erwachsener · Preisstufe A</span><b>Vor Fahrtantritt entwerten!</b><div class="stamps">'+[1,2,3,4].map(function(n){return '<span>'+(stamped&&n===1?'08.10.<br>15:41':n)+'</span>'}).join('')+'</div></div>';
}
function panelHTML(kind){
  if(kind==='entwerter')return '<div class="platform"><div class="gsign">Gleis 2</div><div class="entw">ENTWERTER<i></i>Hier entwerten</div>'+ticketHTML(false)+'</div>';
  if(kind==='stamped')return '<div class="platform">'+ticketHTML(true)+'</div>';
  if(kind==='unstamped')return '<div class="platform">'+ticketHTML(false)+'</div>';
  return '';
}
function talkScene(step){
  var t=step.talk,f=G.fb&&G.fb.o.fb&&G.fb.o.fb.talk;
  if(f)t=f;
  var h='<div class="shop">';
  if(t.line)h+='<div class="cashier">'+I[t.av||'avatar']+'<div class="bubble">'+spk(t.line[0])+'<div class="de">'+t.line[0]+'</div>'+gl(t.line[1])+'</div></div>';
  return h+panelHTML(t.panel)+'</div>';
}
function wblock(b){
  if(b.t==='h')return '<h3 class="wh">'+b.de+gl(b.en)+'</h3>';
  if(b.t==='row'||b.t==='tot')return '<div class="wrow'+(b.t==='tot'?' tot':'')+'"><div><span>'+b.de+'</span>'+gl(b.en)+'</div><b>'+b.v+'</b></div>';
  if(b.t==='p')return '<p class="wp">'+b.de+gl(b.en)+'</p>';
  if(b.t==='chk')return '<div class="wchk"><i class="'+(b.on?'on':'')+'"></i><span>'+b.de+gl(b.en)+'</span></div>';
  if(b.t==='addr')return '<div class="waddr">'+b.lines.join('<br>')+'</div>';
  return '';
}
function webScene(step){
  var w=step.web,names=['Warenkorb','Adresse','Zahlung','Prüfen'];
  var crumbs=w.crumb?'<div class="crumbs">'+names.map(function(c,i){return '<span class="'+(i+1===w.crumb?'on':(i+1<w.crumb?'done':''))+'">'+(i+1)+' '+c+'</span>'}).join('')+'</div>':'';
  var opts=G.fb?step.opts.map(function(o,i){return '<div class="wstatic'+(i===G.fb.i?' chosen':'')+'">'+o.de+gl(o.en)+'</div>'}).join(''):step.opts.map(function(o,i){return opt(o,i,'wopt'+(o.pri?' pri':''))}).join('');
  return '<div class="browser"><div class="urlbar">'+KEY_LOCK+'<span>kleiderhaus-muster.de/kasse</span></div><div class="page"><div class="shop-h">KLEIDERHAUS MUSTER</div>'+crumbs+w.blocks.map(wblock).join('')+'<div class="web-opts '+w.ui+'">'+opts+'</div></div></div>';
}
function storeScene(step){
  if(step.store==='signs'){
    var s='<div class="floor"><div class="signs">'+step.opts.map(function(o,i){return G.fb?'<div class="sign"><div class="optw"><div class="opt static'+(i===G.fb.i?' chosen':'')+'"><span class="de">'+o.de+'</span>'+gl(o.en)+'</div></div></div>':opt(o,i,'sign')}).join('')+'</div><div class="shelves"><div class="shelf"></div><div class="shelf"></div><div class="shelf"></div><div class="shelf"></div></div><div class="you">'+I.you+'Du, mit Einkaufskorb</div></div>';
    return s;
  }
  var c=step.cash,line=c.line;
  var b=ITEMS.map(function(x){return '<span class="item">'+x[0]+' '+x[1]+'</span>'}).join('');
  if(G.st.bag)b+='<span class="item bagi">Tragetasche 0,20</span>';
  var h='<div class="shop"><div class="cashier">'+I.avatar+'<div class="bubble">'+spk(step.say)+'<div class="de">'+line[0]+'</div>'+gl(line[1])+'</div></div>'+
   '<div class="counter"><div class="belt" aria-label="Warenband">'+b+'</div><div class="till"><div class="lcd">SUMME<b>'+eur(c.disp)+' €</b></div>'+
   '<div class="term">'+I.card+(c.sign?'<span class="nb">Nur Barzahlung</span>':'<span>EC-Terminal</span>')+'</div>'+
   '<div class="drawer"><span>'+(c.tray?'Rückgeld':'Kassenlade')+'</span><b>'+(c.tray?eur(c.tray)+' €':'')+'</b></div></div></div>';
  if(step.wallet)h+='<div class="you">'+I.cash+'Dein Portemonnaie: 20 €, 50 €</div>';
  return h+'</div>';
}
function fbHTML(){
  var step=stepOf(G.idx),o=G.fb.o,k=o.k,f=o.fb||{},T={good:'Correct',ok:'Okay',bad:'That has consequences'};
  var ic=k==='good'?I.yes:(k==='ok'?I.mid:I.no);
  var h='<div class="fb '+k+'" role="status" aria-live="polite" id="fb"><div class="h">'+ic+'<b>'+(f.t||T[k])+'</b></div><div class="picked">You chose: <b>'+o.de+'</b> ('+o.en+')</div>'+
   '<div class="olist"><span>Your options were:</span>'+step.opts.map(function(x,i){return '<div'+(i===G.fb.i?' class="me"':'')+'><b>'+x.de+'</b> ('+x.en+')</div>'}).join('')+'</div><p>'+(f.b||'')+'</p>';
  if(f.bon){
    var t=total(G),ch=5000-t,it=ITEMS.map(function(x){return '<div><span>'+x[0]+'</span><span>'+x[1]+'</span></div>'}).join('');
    if(G.st.bag)it+='<div><span>Tragetasche</span><span>0,20</span></div>';
    h+='<div class="bon"><div><b>SUPERMARKT</b></div><hr>'+it+'<hr><div><b>SUMME EUR</b><b>'+eur(t)+'</b></div><div><span>Gegeben BAR</span><span>50,00</span></div><div><span>Rückgeld</span><span>'+eur(ch)+'</span></div><hr><div><span>Vielen Dank!</span><span></span></div></div>';
  }
  var last=G.idx===G.m.steps.length-1;
  var lbl=k==='bad'?'Try again':(last?'See the summary':'Next');
  h+='<div class="actions"><button class="btn" data-next>'+lbl+'</button>'+(k==='bad'?'':'<button class="btn ghost" data-unchoose>Try another option</button>')+'</div>';
  return h+'</div>';
}
function missionView(){
  var step=stepOf(G.idx),n=G.m.steps.length;
  var pct=Math.round((G.idx+(G.fb&&G.fb.o.k!=='bad'?1:0))/n*100);
  var h='<div class="bar"><div class="actions"><button class="btn ghost" data-home>← Missions</button><button class="btn ghost" data-back'+((G.idx===0&&!G.fb)?' disabled':'')+'>Back</button></div>'+toolsHTML()+'</div>'+
   '<div class="goal">'+KEY_C+'<div><b>Your mission</b><span>'+G.m.goal+'</span></div></div>'+
   '<div class="prog"><div class="row"><span>'+step.task+'</span><span>Step '+(G.idx+1)+' / '+n+'</span></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'+
   '<div class="narr"><p>'+step.narr+'</p></div>';
  var sc=G.m.scene,mach=(sc==='atm'||sc==='ticket'||sc==='locker');
  h+=step.talk?talkScene(step):(sc==='web'?webScene(step):(mach?machineScene(step):storeScene(step)));
  if(step.info&&!G.fb){
    h+='<button class="btn" data-adv>Next</button>';
  } else if(!G.fb){
    if(step.talk){
      h+='<div class="tray"><span class="lbl">'+(step.you?'You say:':'What do you do?')+'</span>'+step.opts.map(function(o,i){return opt(o,i,'tray-o')}).join('')+'</div>';
    } else if(mach&&(step.zone||step.type==='pin')){
      h+='<div class="tray"><span class="lbl">What do you do?</span>'+step.opts.map(function(o,i){return opt(o,i,'tray-o')}).join('')+'</div>';
    } else if(sc==='store'&&step.cash){
      h+='<div class="say-wrap say-opt"><span class="lbl">You say:</span>'+step.opts.map(function(o,i){return opt(o,i,'say-o')}).join('')+'</div>';
    }
    h+='<p class="note">Tap the speaker to hear the German. Say it aloud, then tap your choice. Nothing is translated until you choose.</p>';
  } else h+=fbHTML();
  return h;
}
function debrief(){
  var m=G.m,flawless=G.mist===0;
  var h='<div class="bar"><button class="btn ghost" data-home>← Missionen</button>'+toolsHTML()+'</div><div class="deb"><div class="big"><span class="key-done" style="color:'+(flawless?'var(--gold)':'var(--keyo)')+'">'+KEY_O+'</span><div><h2>Mission geschafft</h2><span class="note">'+(flawless?'Ohne einen Fehlversuch. Goldener Schlüssel.':G.mist+' Fehlversuch'+(G.mist===1?'':'e')+'. Spiel nochmal für den goldenen Schlüssel.')+'</span></div></div>'+
   '<div><b>Diese Wörter hast du gebraucht</b><div class="vocab" style="margin-top:8px">'+m.vocab.map(function(v){return '<button data-say="'+esc(v[0])+'">'+v[0]+gl(v[1],1)+'</button>'}).join('')+'</div></div>'+
   '<div class="cost"><b>Wörter, die dich kosten</b>'+m.costly.map(function(c){return '<div><b style="text-transform:none;letter-spacing:0;font-size:16px">'+c[0]+'</b><br>'+c[1]+'</div>'}).join('')+'</div>'+
   '<p class="note">'+m.note+'</p><div class="actions"><button class="btn" data-start="'+m.id+'">Nochmal spielen</button><button class="btn ghost" data-home>Alle Missionen</button></div></div>';
  return h;
}
function render(){
  var h;
  if(!G)h=dashboard();else if(G.fin)h=debrief();else h=missionView();
  app.innerHTML=h;
}

/* ---------- events ---------- */
function pick(i){
  if(!G||G.fb)return;
  var step=stepOf(G.idx),o=step.opts[i];if(!o)return;
  if(o.k==='bad'){if(!G.right[G.idx]){G.bad[G.idx]=true;G.mist=Object.keys(G.bad).length}}else G.right[G.idx]=true;
  if(o.k!=='bad'&&o.set)o.set(G.st);
  if(o.skip){G.right[G.idx]=true;if(o.set)o.set(G.st);forward();return}
  G.fb={o:o,i:i};G.hint='';
  if(prefs.snd&&o.k!=='bad'&&step.type!=='pin')speak(o.de);
  render();
  var f=document.getElementById('fb');if(f&&f.scrollIntoView)f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function unchoose(){G.st=cp(G.snap[G.idx]);G.fb=null;G.pin='';G.hint='';render()}
function forward(){
  G.idx++;G.fb=null;G.pin='';G.hint='';
  if(G.idx>=G.m.steps.length){G.fin=true;done[G.m.id]=true;sset('lk_done',JSON.stringify(done))}
  else G.snap[G.idx]=cp(G.st);
  render();window.scrollTo(0,0);
}
function next(){
  if(!G||!G.fb)return;
  if(G.fb.o.k==='bad'){unchoose();return}
  forward();
}
function back(){
  if(!G||G.fin)return;
  if(G.fb){unchoose();return}
  if(G.idx===0)return;
  G.idx--;G.st=cp(G.snap[G.idx]);G.fb=null;G.pin='';G.hint='';
  render();window.scrollTo(0,0);
}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.say!==undefined){speak(t.dataset.say);return}
  if(t.dataset.start){start(t.dataset.start);return}
  if('home' in t.dataset){home();return}
  if(t.dataset.tog){prefs[t.dataset.tog]=!prefs[t.dataset.tog];sset('lk_'+t.dataset.tog,prefs[t.dataset.tog]?'1':'0');if(!prefs.snd&&CAN_SPEAK)try{speechSynthesis.cancel()}catch(x){};render();return}
  if('back' in t.dataset){back();return}
  if('unchoose' in t.dataset){unchoose();return}
  if(t.dataset.pick!==undefined){pick(+t.dataset.pick);return}
  if('next' in t.dataset){next();return}
  if('adv' in t.dataset){forward();return}
  if(t.dataset.d!==undefined){if(G&&!G.fb&&G.pin.length<4){G.pin+=t.dataset.d;G.hint='';render()}return}
  if(t.dataset.key){
    if(!G||G.fb)return;
    var step=stepOf(G.idx);
    if(t.dataset.key==='fix'){G.pin='';G.hint='';render();return}
    if(t.dataset.key==='ok'&&G.pin.length<4){G.hint='Bitte 4 Ziffern eingeben';render();return}
    for(var i=0;i<step.opts.length;i++){if(step.opts[i].key===t.dataset.key){pick(i);return}}
  }
});
render();
window.__lk={start:start,pick:pick,next:next,back:back,get G(){return G},stepOf:stepOf};
})();
</script>
</body>
</html>
