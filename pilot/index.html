.btn.second{background:transparent}

:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{width:26px;height:26px;margin-top:2px;accent-color:var(--navy);flex:none}
.task .t{flex:1}
.task .t b{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.daylist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{border:2px solid var(--line);background:var(--sand);border-radius:10px;padding:8px 0;font:inherit;font-weight:700;cursor:pointer;min-height:44px;color:var(--navy)}

.dbtn.done{background:var(--mint)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:100px;border:2px solid var(--navy);background:transparent;border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;color:var(--navy)}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--sand)}
label{display:block;font-weight:700;margin:12px 0 4px}

.checks label{display:flex;gap:10px;align-items:center;font-weight:400;margin:6px 0}
.checks input{width:22px;height:22px;accent-color:var(--navy)}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.ok{color:var(--mint-ink);font-weight:700}
.err{color:var(--coral-ink);font-weight:700}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.de{font-weight:700}
</style>
</head>

  Array.prototype.forEach.call(document.querySelectorAll("[data-feel]"),function(b){b.addEventListener("click",function(){f.feel=b.getAttribute("data-feel");save();Array.prototype.forEach.call(document.querySelectorAll("[data-feel]"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});});});
  Array.prototype.forEach.call(document.querySelectorAll("[data-did]"),function(c){c.addEventListener("change",function(){f.did[c.getAttribute("data-did")]=c.checked;save();});});
  [["fb-min","min"],["fb-int","inter"],["fb-com","com"]].forEach(function(p){var el=document.getElementById(p[0]);el.addEventListener("input",function(){f[p[1]]=el.value;save();});});
  var wa=document.getElementById("fb-wa");
  wa.addEventListener("click",function(){wa.href=WA+"?text="+encodeURIComponent(toText(gather(d)));});
  var msg=document.getElementById("fb-msg");
  document.getElementById("fb-copy").addEventListener("click",function(){
    var t=toText(gather(d));
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){msg.textContent="Copied. Paste it into WhatsApp or an email to Johanna.";msg.className="small ok";},function(){msg.textContent=t;});}
    else{msg.textContent=t;}
  });
  document.getElementById("fb-send").addEventListener("click",function(){
    var r=gather(d);
    if(!r.feel){msg.textContent="Please tap too hard, fine or too easy first.";msg.className="small err";return;}
    var rec={day:d,feel:r.feel,date:dstr(Date.now()),sent:!TEST};
    if(!TEST){
      try{var fd=new FormData();fd.append("level","PILOT");fd.append("lesson","day "+d);fd.append("message",toText(r));fd.append("page","/pilot");fetch(WEBHOOK,{method:"POST",mode:"no-cors",body:fd});}catch(e){}
    }
    S.log.push(rec);S.draft={};save();
    render();
    var m2=document.getElementById("fb-msg");m2.textContent=TEST?"Test mode: nothing was sent.":"Sent. Thank you!";m2.className="small ok";
    document.getElementById("feedback").scrollIntoView();
  });
}
window.addEventListener("pagehide",stopAudio);
render();
if(location.hash==="#feedback"){var fb=document.getElementById("feedback");if(fb)fb.scrollIntoView();}
})();
</script>
</body>
</html>
