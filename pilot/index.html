<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your German path | Speak German - now.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E172D;--coral:#F66F54;--coral-ink:#B8412A;--mint:#BCDDBF;--mint-ink:#3F7A4C;--green:#2E8B4F;--sand:#F3EBDF;--cream:#EEE5DA;--linen:#ECE0D1;--line:#D9CBB8;--muted:#4A5266;--f:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--navy);font-family:var(--f);font-size:18px;line-height:1.5;text-align:left;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:12px 16px 90px}
.head{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem}
.brand svg{width:22px;height:22px;stroke:var(--coral);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand .now{color:var(--coral)}
.daychip{background:var(--cream);border:1px solid var(--linen);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem}
.muted{color:var(--muted)}.small{font-size:.92rem}
a{color:var(--navy)}
.btn{display:inline-block;background:var(--coral);color:var(--navy);border:2px solid var(--navy);border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;min-height:48px;white-space:nowrap}
.btn.second{background:transparent}
.btn.sm{padding:4px 12px;min-height:40px}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
/* door */
.doorwrap{text-align:center;margin:4px 0 10px}
.portal{position:relative;width:min(150px,42vw);margin:0 auto;aspect-ratio:240/300}
.portal svg.arch{width:100%;height:100%;display:block;overflow:visible}
.portal .leaf{transform-box:fill-box;transition:transform .9s cubic-bezier(.65,0,.25,1)}
.portal .leafL{transform-origin:left center}.portal .leafR{transform-origin:right center}
.portal.open .leaf{transform:scaleX(.06)}
.portal .glow{opacity:.55;transition:opacity .9s}.portal.open .glow{opacity:1}
.portalmsg{position:absolute;inset:34% 12% 16%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:.9rem;line-height:1.2;color:var(--sand)}
.doorbig{font-size:1.3rem;font-weight:700;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.portal .leaf,.portal .glow{transition:none!important}}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;margin:0 0 12px;border:2px dashed var(--line);background:#E8E0D3;color:var(--muted);transition:transform .15s,box-shadow .15s,background .15s}
.row[data-on="1"]{background:var(--mint);border:2px solid var(--navy);color:var(--navy);box-shadow:0 5px 0 var(--navy);transform:translateY(-3px)}
.tog{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid #A79B88;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tog svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row[data-on="1"] .tog{background:var(--green);border-color:var(--green)}
.row[data-on="1"] .tog svg{opacity:1}
.mid{flex:1;min-width:0}
.mid b{display:flex;align-items:center;gap:8px;font-size:1.15rem}
.mid b svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mid .tm{font-variant-numeric:tabular-nums;font-size:.95rem;display:block}
.mid .sub{font-size:.98rem;display:block}
.row .btn{flex:none}
.panel{background:var(--cream);border:1px solid var(--linen);border-radius:16px;padding:14px;margin:-4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:2px solid var(--navy);background:transparent;border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;color:var(--navy)}
.chip[aria-pressed=true]{background:var(--navy);color:var(--sand)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 4px}
.total b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.checkin{display:block;width:100%;min-height:92px;font:inherit;font-size:1.6rem;font-weight:700;background:var(--coral);color:var(--navy);border:3px solid var(--navy);border-radius:22px;box-shadow:0 8px 0 var(--navy);cursor:pointer;margin:14px 0 20px}
.checkin:active{transform:translateY(5px);box-shadow:0 3px 0 var(--navy)}
textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);min-height:80px;margin:0 0 8px}
.linkbtn{background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;color:var(--muted);padding:10px 0;min-height:44px}
.banner{background:#fff;border:2px solid var(--coral);border-radius:12px;padding:6px 12px;margin:0 0 10px}
.daylist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.dbtn{border:2px solid var(--line);background:var(--sand);border-radius:10px;padding:8px 0;font:inherit;font-weight:700;cursor:pointer;min-height:44px;color:var(--navy)}
.dbtn[aria-current=true]{border-color:var(--navy);background:var(--mint)}
.dbtn.done{background:var(--mint)}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--muted)}
.ex{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border-radius:999px;padding:2px 4px 2px 12px;margin:0 6px 6px 0}
.ex button{border:0;background:transparent;font:inherit;font-weight:700;cursor:pointer;min-width:40px;min-height:40px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
</style>
</head>
<body>
<main class="wrap" id="top"><div id="app"></div></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="/pilot/shared.js?v=5"></script>
<script>
(function(){
"use strict";
var DAYS=[{"d": 1, "from": 0, "to": 3, "chain": "", "rep": "", "chal": "Say Hallo and Danke out loud."}, {"d": 2, "from": 3, "to": 6, "chain": "", "rep": "", "chal": "Say Bitte when you hand something over."}, {"d": 3, "from": 6, "to": 9, "chain": "", "rep": "", "chal": "Say Ich bin and your name."}, {"d": 4, "from": 9, "to": 12, "chain": "A", "rep": "", "chal": "Ask Was ist das? about something."}, {"d": 5, "from": 12, "to": 15, "chain": "", "rep": "A", "chal": "Say Entschuldigung once."}, {"d": 6, "from": 15, "to": 18, "chain": "", "rep": "A", "chal": "Say Kein Problem once."}, {"d": 7, "from": 18, "to": 21, "chain": "B", "rep": "", "chal": "Say Ich möchte Wasser, bitte."}, {"d": 8, "from": 21, "to": 24, "chain": "C", "rep": "", "chal": "Say Mit Karte, bitte. when you pay."}, {"d": 9, "from": 24, "to": 27, "chain": "D", "rep": "", "chal": "Say Wie bitte? when you miss something."}, {"d": 10, "from": 27, "to": 30, "chain": "", "rep": "B", "chal": "Ask someone Wie geht's?"}, {"d": 11, "from": 30, "to": 33, "chain": "", "rep": "C", "chal": "Say Ich habe ein Problem."}, {"d": 12, "from": 33, "to": 36, "chain": "", "rep": "D", "chal": "Say Können Sie mir helfen?"}, {"d": 13, "from": 36, "to": 39, "chain": "", "rep": "D", "chal": "Say Na klar! once."}, {"d": 14, "from": 39, "to": 40, "chain": "E", "rep": "", "chal": "Say Ich spreche kein Deutsch."}];
var WA="https://wa.me/5548999373120";
var KEY="lingokey-pilot-path-v1";
var DAYMS=86400000;
var S;
function fresh(){return {start:null,day:null,done:{},lastOpen:null};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.done)return o;}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
S=load();
if(!S.start){S.start=LK.dkey();save();}
function todayNum(){var a=new Date(S.start+"T00:00:00").getTime(),b=new Date(LK.dkey()+"T00:00:00").getTime();return Math.max(1,Math.min(14,Math.round((b-a)/DAYMS)+1));}
function cur(){return S.day||todayNum();}
function tkey(d,t){return d+":"+t;}
var autoOf={cards:"cards",chain:"chains",listen:"listen"};
function isOn(d,t){if(S.done[tkey(d,t)])return true;if(d===todayNum()&&autoOf[t]&&LK.isDone(autoOf[t]))return true;return false;}
var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var IC={
cards:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
chain:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
listen:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
other:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
say:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'};
var ARCH="M36 284V132a84 84 0 0 1 168 0V284";
function door(closed,msg){
  return '<div class="portal'+(closed?'':' open')+'" id="portal"><svg class="arch" viewBox="0 0 240 300" aria-hidden="true"><defs><clipPath id="pc"><path d="'+ARCH+'Z"/></clipPath><radialGradient id="pg" cx="50%" cy="60%" r="65%"><stop offset="0" stop-color="#F3EBDF"/><stop offset=".6" stop-color="#BCDDBF"/><stop offset="1" stop-color="#F66F54"/></radialGradient></defs>'+
  '<path d="'+ARCH+'Z" fill="url(#pg)" class="glow"/><g clip-path="url(#pc)"><rect class="leaf leafL" x="36" y="40" width="85" height="250" fill="#0E172D"/><rect class="leaf leafR" x="119" y="40" width="85" height="250" fill="#0E172D"/><path d="M120 40V290" stroke="#4A5266" stroke-width="2"/></g>'+
  '<path d="'+ARCH+'" fill="none" stroke="#ECE0D1" stroke-width="12" stroke-linejoin="round"/><path d="M26 284H214" stroke="#0E172D" stroke-width="6" stroke-linecap="round"/></svg>'+(msg?'<div class="portalmsg">'+msg+'</div>':'')+'</div>';
}
var panelOpen=false,noteOpen=false,exType="",exMin=0;
function row(vd,key,icon,title,sub,btn,tm,toggleable){
  var on=isOn(vd,key);
  if(key==="cards"&&!on&&vd===todayNum()){var c=LK.day().cards,g=c.goal||0,a=c.ans||0;if(g&&a>0)sub=Math.min(99,Math.round(100*a/g))+"% of daily goal";}
  return '<div class="row" data-on="'+(on?1:0)+'"><button class="tog" type="button" data-t="'+key+'" aria-pressed="'+on+'" aria-label="Done: '+esc(title)+'">'+CHECK+'</button><div class="mid"><b>'+IC[icon]+esc(title)+'</b>'+(tm?'<span class="tm" data-tm="'+tm+'">'+tm2(tm)+'</span>':'')+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>'+(btn||'')+'</div>';
}
function tm2(t){return t==="other"?LK.extraMin()+" min":LK.fmt(LK.day().ms[t]);}
function render(){
  LK.refresh();
  var vd=cur(),x=DAYS[vd-1],today=todayNum(),ci=LK.day().checkin;
  var first=S.lastOpen!==LK.dkey();
  var h='<div class="head"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="4"/><path d="M10 10l9 9"/><path d="M15.5 15.5l2.5-2.5"/><path d="M17.5 17.5l2.5-2.5"/></svg><span>Speak German<span class="now"> - now.</span></span></div><span class="daychip">Day '+vd+' of 14</span></div>';
  if(LK.isTest())h+='<div class="banner small">Test mode: nothing is sent. <a href="?test=0">Turn off</a></div>';
  if(ci){
    h+='<div class="doorwrap">'+door(true,"All done for the day, go have fun and rest!")+'<p class="doorbig">Day '+ci.day+' checked in</p></div>';
    h+='<div class="total"><span class="muted">Today</span><b data-tmt>'+LK.fmtMin(LK.totalMs())+'</b></div>';
    h+='<p style="text-align:center"><button class="linkbtn" type="button" id="uncheck">Change my check-in</button></p>';
  }else{
    h+='<div class="doorwrap">'+door(first,"")+'</div>';
    if(vd!==today)h+='<div class="banner small">Looking at day '+vd+'. <button class="linkbtn" type="button" id="gotoday" style="padding:0;min-height:32px">Back to today</button></div>';
    h+=row(vd,"cards","cards","Learn Words","",'<a class="btn" href="/pilot/cards/">Start</a>',"cards");
    if(x.chain)h+=row(vd,"chain","chain","Chain: Stage "+x.chain,"",'<a class="btn" href="/pilot/chains/">Start</a>',"chains");
    else if(x.rep)h+=row(vd,"chain","chain","Chain","",'<a class="btn second" href="/pilot/chains/">Start</a>',"chains");
    h+=row(vd,"listen","listen","Listen","10 min, hands-off",'<a class="btn" href="/pilot/listen/">Start</a>',"listen");
    h+=row(vd,"other","other","Other German","",'<button class="btn second" type="button" id="addtoggle">'+(panelOpen?'Close':'Add')+'</button>',"other");
    if(panelOpen)h+=panelHtml();
    h+=row(vd,"chal","say","Try it",x.chal,"","");
    h+='<div class="total"><span class="muted">Today</span><b data-tmt>'+LK.fmtMin(LK.totalMs())+'</b></div>';
    h+=noteOpen?'<textarea id="note" aria-label="Note to Johanna" placeholder="Note to Johanna"></textarea>':'<button class="linkbtn" type="button" id="notebtn">Add a note</button>';
    h+='<button class="checkin" type="button" id="checkin">My check-in for the day</button>';
  }
  h+='<details><summary>All 14 days</summary><div class="daylist" role="group" aria-label="Choose a day">';
  for(var i=1;i<=14;i++){h+='<button class="dbtn'+(isOn(i,"cards")?" done":"")+'" type="button" data-day="'+i+'" '+(i===vd?'aria-current="true"':'')+'>'+i+'</button>';}
  h+='</div><p class="small muted">All days so far: <span data-tma>'+LK.fmtMin(LK.overallMs())+'</span>. <a href="'+WA+'">Help on WhatsApp</a></p></details>';
  document.getElementById("app").innerHTML=h;
  wire();
  if(!ci&&first){var p=document.getElementById("portal");S.lastOpen=LK.dkey();save();if(p)setTimeout(function(){p.classList.add("open");},450);}
  if(!ci&&!first){S.lastOpen=LK.dkey();save();}
}
function panelHtml(){
  var h='<div class="panel"><div class="chips" role="group" aria-label="What did you do">';
  ["Class","Conversation","Real life","Podcast","Other"].forEach(function(t){h+='<button class="chip" type="button" data-ext="'+t+'" aria-pressed="'+(exType===t)+'">'+t+'</button>';});
  h+='</div><div class="chips" role="group" aria-label="Minutes">';
  [5,10,20,30,60].forEach(function(m){h+='<button class="chip" type="button" data-exm="'+m+'" aria-pressed="'+(exMin===m)+'">'+m+' min</button>';});
  h+='</div><button class="btn" type="button" id="ex-add"'+(exType&&exMin?'':' disabled style="opacity:.45"')+'>Add</button>';
  var d=LK.day();
  if(d.extra.length){h+='<div style="margin-top:12px">'+d.extra.map(function(e,i){return '<span class="ex">'+esc(e.type)+' '+e.min+' min<button type="button" data-rm="'+i+'" aria-label="Remove">✕</button></span>';}).join("")+'</div>';}
  return h+'</div>';
}
function wire(){
  var vd=cur(),y;
  function again(){y=window.scrollY;render();window.scrollTo(0,y);}
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(b){b.addEventListener("click",function(){var k=tkey(vd,b.getAttribute("data-t"));if(S.done[k])delete S.done[k];else S.done[k]=1;save();again();});});
  Array.prototype.forEach.call(document.querySelectorAll("[data-day]"),function(b){b.addEventListener("click",function(){S.day=parseInt(b.getAttribute("data-day"),10);save();render();window.scrollTo(0,0);});});
  var g=document.getElementById("gotoday");if(g)g.addEventListener("click",function(){S.day=null;save();render();});
  var at=document.getElementById("addtoggle");if(at)at.addEventListener("click",function(){panelOpen=!panelOpen;again();});
  Array.prototype.forEach.call(document.querySelectorAll("[data-ext]"),function(b){b.addEventListener("click",function(){exType=b.getAttribute("data-ext");again();});});
  Array.prototype.forEach.call(document.querySelectorAll("[data-exm]"),function(b){b.addEventListener("click",function(){exMin=parseInt(b.getAttribute("data-exm"),10);again();});});
  var add=document.getElementById("ex-add");
  if(add)add.addEventListener("click",function(){if(!(exType&&exMin))return;LK.addExtra(exType,exMin,"");exType="";exMin=0;again();});
  Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.addEventListener("click",function(){LK.removeExtra(parseInt(b.getAttribute("data-rm"),10));again();});});
  var nb=document.getElementById("notebtn");if(nb)nb.addEventListener("click",function(){noteOpen=true;again();var n=document.getElementById("note");if(n)n.focus();});
  var ck=document.getElementById("checkin");
  if(ck)ck.addEventListener("click",function(){
    var n=document.getElementById("note"),note=n?n.value.trim():"";
    var t=todayNum(),ticks=["cards","chain","listen","chal"].filter(function(k){return isOn(t,k);});
    var full="ticked: "+(ticks.join(", ")||"none")+(note?" | "+note:"");
    confetti();LK.checkin(LK.dkey(),t,full);noteOpen=false;panelOpen=false;
    setTimeout(function(){render();window.scrollTo(0,0);},900);
  });
  var uc=document.getElementById("uncheck");if(uc)uc.addEventListener("click",function(){LK.uncheckin(LK.dkey());S.lastOpen=LK.dkey();save();render();});
}
function refreshTimes(){
  LK.refresh();var d=LK.day();
  ["cards","chains","listen"].forEach(function(t){var e=document.querySelector('[data-tm="'+t+'"]');if(e)e.textContent=LK.fmt(d.ms[t]);});
  var o=document.querySelector('[data-tm="other"]');if(o)o.textContent=LK.extraMin()+" min";
  var a=document.querySelector("[data-tmt]");if(a)a.textContent=LK.fmtMin(LK.totalMs());
  var b=document.querySelector("[data-tma]");if(b)b.textContent=LK.fmtMin(LK.overallMs());
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")render();});
window.addEventListener("pageshow",function(e){if(e.persisted)render();});
function confetti(){
  var cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  cv.width=innerWidth;cv.height=innerHeight;
  var cols=["#F66F54","#BCDDBF","#0E172D","#F3EBDF","#2E8B4F","#F9C9BE"],ps=[],n=reduce?30:160;
  for(var i=0;i<n;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.62,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  var t0=Date.now();
  (function frame(){
    var el=Date.now()-t0;ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){p.vy+=0.45;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-el/2800);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(el<2800)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
setInterval(function(){if(document.visibilityState==="visible")refreshTimes();},5000);
render();
})();
</script>
</body>
</html>
