<!doctype html>
<html lang="en">

<title>Speak German - now. Pilot cards</title>
<style>
/* Layout: one phone-width column, centred on larger screens. Bottom tab bar. Cards sit on cream, page on sand. */
:root{
  --navy:#0E172D;
  --coral:#F66F54;
  --mint:#BCDDBF;
  --mint-ink:#3F7A4C;
  --sand:#F3EBDF;
  --cream:#EEE5DA;
  --linen:#ECE0D1;
  --line:#D9CBB8;
  --muted:#4A5266;
  --coral-soft:#F9C9BE;
  --coral-ink:#B8412A;
  --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--navy);font-family:var(--sys);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:-.02em;font-size:1.15rem}
.brand .now{color:var(--coral)}
.brand svg{width:22px;height:22px;stroke:var(--coral);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--linen);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;color:var(--navy)}
h1{font-size:1.9rem;line-height:1.1;font-weight:900;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:900;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.rc .rcde{font-size:1.25rem;font-weight:800;color:var(--navy)}
.cnote,#cexp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--sand);color:var(--navy);font:inherit;resize:vertical}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--cream);border:1px solid var(--linen);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(14,23,45,.06)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;background:var(--coral);color:var(--navy);box-shadow:0 6px 0 var(--navy);transform:translateY(0);transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
.btn.again{background:var(--cream);border:1px solid var(--line)}
.btn.good{background:var(--mint)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--navy);padding:11px 16px;min-height:44px}
.btn.ghost:active{transform:none}
.btn.small{padding:9px 14px;min-height:40px;box-shadow:0 4px 0 var(--navy);font-size:.9rem}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;padding:0;color:var(--coral-ink);font-weight:800;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--navy)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sand);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{background:none;border:0;border-radius:12px;padding:8px 2px;font-size:.78rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--navy);background:var(--cream)}

/* portal */
.portal{position:relative;width:min(300px,80vw);margin:6px auto 0;aspect-ratio:240/300}
.portal svg.arch{width:100%;height:100%;display:block;overflow:visible}
.portal .leaf{transform-box:fill-box;transition:transform .8s cubic-bezier(.65,0,.25,1)}
.portal .leafL{transform-origin:left center}.portal .leafR{transform-origin:right center}
.portal.open .leaf{transform:scaleX(.06)}
.portal .glow{opacity:.55;transition:opacity .8s}.portal.open .glow{opacity:1}
.keybtn{position:absolute;left:50%;bottom:-8%;width:74%;aspect-ratio:1;transform:translateX(-50%) rotate(-8deg);background:none;border:0;padding:0;cursor:pointer;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .5s .3s;animation:bob 3s ease-in-out infinite}
.keybtn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 0 var(--navy));stroke:var(--coral);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.keybtn:hover{transform:translateX(-50%) rotate(-4deg) scale(1.03)}
.keybtn:focus-visible{outline:3px solid var(--navy);outline-offset:6px;border-radius:24px}
.portal.open .keybtn{animation:none;transform:translateX(-50%) rotate(34deg) translateY(8%);opacity:0}
.portalmsg{position:absolute;inset:34% 18% 20%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:1.15rem;color:var(--sand)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@media (prefers-reduced-motion:reduce){.keybtn{animation:none}.portal .leaf,.keybtn{transition:none!important}}
/* ring */
.ringwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:6px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .begin{position:absolute;inset:18%;border-radius:50%;font-size:1.5rem;font-weight:900;display:grid;place-items:center;text-align:center;line-height:1.15;padding:10px}
/* session */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counts{display:flex;gap:14px;font-weight:800;font-size:.9rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bar{height:6px;background:var(--linen);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s}
.pic{aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--linen);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;color:var(--muted)}
.pic svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.pic .scene{font-size:.8rem;line-height:1.35;max-width:30ch}
.pic .slot{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sentence{font-size:clamp(1.7rem,6.5vw,2.3rem);font-weight:900;letter-spacing:-.02em;line-height:1.2;text-align:center;text-wrap:balance}
.sentence u{text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:4px;text-underline-offset:6px}
.sentence.hidden{filter:blur(10px);user-select:none}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;background:var(--linen);border:1px solid var(--line);color:var(--muted)}
.tag.new{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
.tag.rev{background:var(--mint);border-color:var(--mint-ink);color:var(--navy)}
.play{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:99px;background:var(--navy);color:var(--sand);font-weight:800;padding:10px 18px}
.play svg{width:18px;height:18px;fill:currentColor}
.reveal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.reveal .mean{font-size:1.3rem;font-weight:800}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:12px}
.grade .btn small{font-weight:700;color:var(--muted);font-size:.78rem}
.shelve{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;margin-top:10px;padding:8px 12px;background:transparent;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}
.shelve small{font-weight:600;font-size:.72rem}
.shelve:hover{color:var(--navy);border-color:var(--muted)}
.nd{font-size:.58em;color:var(--coral);font-weight:800;margin-left:1px;vertical-align:super}
.gp{color:var(--navy)}
.pat{background:var(--mint);color:var(--navy);padding:8px 10px;border-radius:10px;display:block}
.key{position:absolute;top:6px;right:10px;font-size:.7rem;color:var(--muted);font-weight:700}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.big{font-size:3rem;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:7px;background:var(--linen);border:1px solid var(--line)}
.cell.l{background:var(--coral-soft);border-color:var(--coral)}
.cell.r{background:var(--mint);border-color:var(--mint-ink)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--linen);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.ok{color:var(--mint-ink);font-weight:800;white-space:nowrap}
.no{color:var(--coral-ink);font-weight:800}
.seg{display:inline-flex;border:2px solid var(--navy);border-radius:12px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-weight:800;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sand)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--linen)}
.statebtn{border:1px solid var(--line);background:var(--sand);border-radius:99px;padding:3px 10px;font-weight:800;font-size:.75rem}
.statebtn.approved{background:var(--mint);border-color:var(--mint-ink)}
.statebtn.fix{background:var(--coral-soft);border-color:var(--coral)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;font-weight:700}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--sand);color:var(--navy);padding:10px;font:inherit;font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.more summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.more{display:block}
</style>

  if(S&&S.set&&S.set.voice){for(var i=0;i<r.length;i++){if(r[i].name===S.set.voice)return r[i];}}
  return r[0];
}
if("speechSynthesis" in window){loadVoices();try{window.speechSynthesis.onvoiceschanged=function(){loadVoices();if(route==="settings"&&!sess)render();};}catch(e){}}
function speak(text){
  if(!("speechSynthesis" in window))return false;
  try{
    window.speechSynthesis.cancel();
    if(!voices.length)loadVoices();
    var u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=S.set.speed;
    var v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}
    window.speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}

/* ---------- route / session ---------- */
var route="today";
var sess=null;     // active session
var shadow=null;   // shadow round
var summary=null;
var timer=null;

function startSession(){
  sess={t0:Date.now(),cur:null,shown:false,newDone:0,rev:0,again:0,good:0,shelved:0,shelfRun:0,offer:null,passed:[],touched:{},before:indexPct(),total:0,learnedBefore:Object.keys(learnedSet()).length};
  route="session";
  pickNext();
  timer=setInterval(tickTimer,1000);
  render();
}
function tickTimer(){var el=document.getElementById("clock");if(el&&sess)el.textContent=clock(window.LK?LK.sessionMs():Date.now()-sess.t0);}
function clock(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function pickNext(){
  sess.cur=pickCard();
  sess.shown=false;
  if(sess.cur&&S.set.auto)setTimeout(function(){if(sess&&sess.cur)speak(sess.cur.c.de);},250);
}
function nextTopic(idx){for(var i=0;i<TOPICS.length;i++){var j=IDX[TOPICS[i][0]];if(j>idx)return {name:TOPICS[i][1],idx:j};}return null;}
function shelve(){
  if(!sess||!sess.cur||sess.offer)return;
  var c=sess.cur.c;
  S.cards[c.n]={st:"shelved",shelvedAt:now(),reps:0};
  sess.shelved++;sess.shelfRun++;if(window.LK)LK.cardStat('sh');sess.touched[c.n]=1;
  save();pickNext();
  if(!sess.cur){finish();return;}
  if(sess.shelfRun>=3&&sess.cur.kind==="new"){var tp=nextTopic(IDX[sess.cur.c.n]);if(tp)sess.offer=tp;}
  render();
}
function jumpTopic(){
  var o=sess.offer;if(!o)return;
  for(var i=0;i<o.idx;i++){if(!S.cards[CARDS[i].n])S.cards[CARDS[i].n]={st:"shelved",shelvedAt:now(),reps:0,sk:1};}
  sess.shelfRun=0;sess.offer=null;save();pickNext();
  if(!sess.cur){finish();return;}
  render();
}
function renderOffer(){
  var o=sess.offer;
  var h='<div class="stack" style="padding-top:4px"><div class="sess-top"><button class="link" data-act="quit">Finish</button><b id="clock" style="font-size:1.3rem;font-variant-numeric:tabular-nums">'+clock(window.LK?LK.sessionMs():Date.now()-sess.t0)+'</b><span style="width:48px"></span></div>';
  h+='<div class="card stack" style="text-align:center"><div class="eyebrow">Already know this?</div><h2 style="margin:0">You shelved '+sess.shelfRun+' cards in a row</h2><p class="muted" style="margin:0">Skip ahead to the next topic: <b>'+esc(o.name)+'</b>. The cards in between are shelved and count as learned, so later sentences can use them.</p><button class="btn good" data-act="jump">Skip to '+esc(o.name)+'</button><button class="link" data-act="stay">No, keep going here</button></div></div>';
  app.innerHTML=h;tabbar();
}
function answer(good){
  if(!sess||!sess.cur||!sess.shown||sess.offer)return;
  sess.shelfRun=0;
  var c=sess.cur.c,s=stateOf(c.n),isNew=!S.cards[c.n];
  var wasDue=!isNew&&s.due<=now();
  var n=plan(s,good);
  if(good&&s.st==="learn"&&n.st==="review"){n.learnedAt=now();}
  if(s.learnedAt&&!n.learnedAt)n.learnedAt=s.learnedAt;
  S.cards[c.n]=n;
  var firstToday=!isCounted(c.n);markCounted(c.n);
  if(isNew){S.dayNew[dkey(now())]=newToday()+1;sess.newDone++;if(window.LK)LK.cardStat('n');}else{sess.rev++;if(firstToday&&window.LK)LK.cardStat('r');}
  if(window.LK)LK.cardStat(good?'gd':'ag');
  if(good){sess.good++;if(sess.passed.indexOf(c.n)<0)sess.passed.push(c.n);}else sess.again++;
  sess.touched[c.n]=1;
  if(wasDue&&sess.cur.kind==="rev"){var k=dkey(now());var o=S.overdue[k]||{done:0};o.done++;S.overdue[k]=o;}
  save();
  pickNext();
  if(!sess.cur){finish();return;}
  render();
}
function finish(){
  if(window.LK)LK.markDone('cards');
  if(timer){clearInterval(timer);timer=null;}
  var ms=Date.now()-sess.t0;
  S.studyMs+=ms;
  var rec={t:now(),day:dkey(now()),ms:ms,newN:sess.newDone,rev:sess.rev,good:sess.good,again:sess.again};
  S.log.push(rec);save();
  var tot=sess.good+sess.again;
  summary={ms:ms,newN:sess.newDone,rev:sess.rev,recall:tot?Math.round(100*sess.good/tot):100,idxBefore:sess.before,idxAfter:indexPct(),passed:sess.passed.slice(),learned:Object.keys(learnedSet()).length,left:CARDS.length-Object.keys(S.cards).length};
  sess=null;route="summary";render();
}
function quit(){if(sess&&(sess.newDone+sess.rev)>0&&window.LK)LK.markDone('cards');if(timer){clearInterval(timer);timer=null;}if(sess){S.studyMs+=Date.now()-sess.t0;S.log.push({t:now(),day:dkey(now()),ms:Date.now()-sess.t0,newN:sess.newDone,rev:sess.rev,good:sess.good,again:sess.again});save();}sess=null;route="today";render();}

/* ---------- derived stats ---------- */
function streak(){
  var days={};S.log.forEach(function(r){days[r.day]=1;});
  var n=0,t=now();
  if(!days[dkey(t)])t-=DAY;
  while(days[dkey(t)]){n++;t-=DAY;}
  return n;
}
function weekMinutes(){
  var out=[],t=now();
  for(var i=6;i>=0;i--){var k=dkey(t-i*DAY),ms=0;S.log.forEach(function(r){if(r.day===k)ms+=r.ms;});
    var d=new Date(t-i*DAY);out.push({k:k,m:Math.round(ms/MIN),l:["S","M","T","W","T","F","S"][d.getDay()],today:i===0});}
  return out;
}
function completion30(){
  var done=0,t=now();for(var i=0;i<30;i++){var o=S.overdue[dkey(t-i*DAY)];if(o)done+=o.done;}
  var open=dueList().length;
  if(done+open===0)return null;
  return Math.round(100*done/(done+open));
}
function todayRevDone(){var o=S.overdue[dkey(now())];return o?o.done:0;}
function todayMs(){var k=dkey(now()),ms=0;S.log.forEach(function(r){if(r.day===k)ms+=r.ms;});return ms;}

function nd(w){var lc=w.replace(/[.,?!]/g,"").toLowerCase();return (typeof NUMS!=="undefined"&&NUMS[lc]!==undefined)?'<sup class="nd">'+NUMS[lc]+'</sup>':"";}
function numw(w){var m=w.match(/^(.*?)([.,?!]*)$/);return esc(m[1])+nd(m[1])+esc(m[2]);}
function dehtml(t){return t.split(" ").map(numw).join(" ");}
function underlined(c){
  var used={},us=ucards(c);

    if(us.indexOf(lc)>=0&&!used[lc]){used[lc]=1;return "<u>"+esc(core)+"</u>"+nd(core)+esc(w.slice(core.length));}
    return numw(w);
  }).join(" ");
}
function render(){

}

function lineChart(){
  var W=520,H=220,L=36,R=14,T=14,B=30,UC=CARDS.filter(function(c){return !c.p;}),N=UC.length;
  function curve(order){var s={},arr=[0];order.forEach(function(c){ucards(c).forEach(function(u){s[u]=1;});arr.push(coverage(s));});return arr;}
  var path=curve(UC);
  var fo=UC.slice().sort(function(a,b){return rk(a)-rk(b);});
  var freq=curve(fo),M=TARGETS.length;
  function X(i){return L+(W-L-R)*i/N;}function Y(v){return T+(H-T-B)*(1-v/M);}
  function pts(a){return a.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1);}).join(" ");}
  var g="";
  [0,25,50,75,100].forEach(function(p){var y=Y(M*p/100);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+p+'%</text>';});
  [0,50,100,150,N].forEach(function(i){g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+i+'</text>';});
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Share of demo lines understood after each card, path order versus pure frequency order">'+g+
   '<polyline points="'+pts(freq)+'" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 4"/>'+
   '<polyline points="'+pts(path)+'" fill="none" stroke="var(--coral)" stroke-width="3.5"/>'+
   '<circle cx="'+X(N)+'" cy="'+Y(path[N])+'" r="4.5" fill="var(--coral)"/></svg>';
  return {svg:svg,a:path[20],b:freq[20]};
}

  var pct=Math.round(100*learned/total),C=2*Math.PI*84;
  var left=total-started,days=left>0?Math.ceil(left/S.set.goal):0;
  var wk=weekMinutes(),mx=Math.max.apply(null,wk.map(function(x){return x.m;}).concat([5]));
  var comp=completion30();
  var h='<div class="stack"><div><div class="eyebrow">A0 to prototype path</div><h1>Progress</h1></div>';

  h+='<p><b>'+learned+'</b> learned of '+total+'</p><p class="small muted">'+started+' cards seen, '+Math.round(S.studyMs/MIN)+' min studied.</p><p class="small muted" style="margin-top:6px">'+(left>0?left+' cards not started yet. The app decides each day how many are new.':'Every card in this prototype has been started.')+'</p></div>';
  h+='<div class="card"><div class="eyebrow">Understanding Index</div><div class="big" style="margin:6px 0">'+indexPct()+'%</div><p class="small">You understand '+indexPct()+'% of the demo set of '+TARGETS.length+' everyday lines.</p></div>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Current streak</div><b style="font-size:1.4rem">'+streak()+' day'+(streak()===1?"":"s")+'</b></div></div><div class="eyebrow" style="margin-top:14px">Minutes this week</div><svg viewBox="0 0 280 110" width="100%" role="img" aria-label="Minutes studied in the last seven days">';
  wk.forEach(function(d,i){var x=14+i*38,hgt=d.m?Math.max(6,Math.round(64*d.m/mx)):2;h+='<rect x="'+x+'" y="'+(78-hgt)+'" width="24" height="'+hgt+'" rx="6" fill="'+(d.m?"var(--coral)":"var(--line)")+'"/><text x="'+(x+12)+'" y="'+(70-hgt)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--navy)">'+(d.m?d.m:"")+'</text><text x="'+(x+12)+'" y="98" text-anchor="middle" font-size="11" fill="'+(d.today?"var(--navy)":"var(--muted)")+'" font-weight="'+(d.today?800:500)+'">'+d.l+'</text>';});
  h+='</svg><div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><span class="small muted">Share of due reviews you completed, 30 days</span><b>'+(comp===null?"No data yet":comp+"%")+'</b></div></div>';
  h+='<div class="card"><h2>Path map</h2><div class="grid" role="list">';
  CARDS.forEach(function(c){var s=stateOf(c.n).st;h+='<div role="listitem" class="cell '+(s==="review"?"r":s==="learn"?"l":"")+'" title="'+esc(c.de)+'"></div>';});
  h+='</div><div class="legend" style="margin-top:10px"><span><i style="background:var(--linen);border:1px solid var(--line);height:10px;width:10px;border-radius:3px"></i>Not started</span><span><i style="background:var(--coral-soft);border:1px solid var(--coral);height:10px;width:10px;border-radius:3px"></i>Learning</span><span><i style="background:var(--mint);border:1px solid var(--mint-ink);height:10px;width:10px;border-radius:3px"></i>Learned</span></div></div>';
  var rec=CARDS.filter(function(c){return stateOf(c.n).learnedAt;}).sort(function(a,b){return stateOf(b.n).learnedAt-stateOf(a.n).learnedAt;}).slice(0,6);
  h+='<div class="card"><h2>Recently learned</h2>'+(rec.length?rec.map(function(c){return '<div class="sw"><b>'+esc(lab(c))+'</b><span class="muted small" style="text-align:right">'+esc(c.en)+'</span></div>';}).join(""):'<p class="small muted">Cards appear here after you rate them Good a second time.</p>')+'</div></div>';
  return h;
}

function viewPath(){
  var ch=lineChart();
  var okN=0;CARDS.forEach(function(c,i){if(validate(i).ok)okN++;});
  var h='<div class="stack"><div><div class="eyebrow">Teacher view</div><h1>Path</h1></div>';
  h+='<div class="card stack"><h2 style="margin:0">Does the order make sentences?</h2><p class="small">Share of the '+TARGETS.length+' demo lines a learner could understand after each card. The line rises when a new word pairs with words already known.</p>'+ch.svg+'<div class="legend"><span><i style="background:var(--coral)"></i>Path order</span><span><i style="background:var(--muted)"></i>Pure frequency order</span></div><p class="small muted">After 20 cards: '+ch.a+' lines on this path, '+ch.b+' in pure frequency order. The demo lines were written for this deck, so this illustrates the metric and does not prove it. The real test needs a sample of real everyday sentences.</p></div>';
  h+='<div class="card stack"><h2 style="margin:0">Card check</h2><p class="small"><b>'+okN+' of '+CARDS.length+'</b> cards pass the rule: every word is already known except exactly one new item. The check runs live in this page.</p><p class="small muted">Review status is yours to set. Tap a status to cycle it: draft, approved, needs fix. A card should only reach students once a native speaker has approved it.</p></div>';
  h+='<div class="card scroll"><table><thead><tr><th>#</th><th>New item</th><th>Sentence</th><th>Frame</th><th>List</th><th>Rule</th><th>Status</th></tr></thead><tbody>';
  CARDS.forEach(function(c,i){
    var v=validate(i),st=S.rev[c.n]||"draft";
    h+='<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(lab(c))+'</b></td><td lang="de">'+esc(c.de)+'<div class="small muted">'+esc(c.en)+'</div></td><td class="small">'+esc(c.f)+'</td><td class="num">'+(c.p?'<span class="muted small">none</span>':'#'+rk(c)+'<div class="small">'+esc(UNITS[ucards(c)[0]].lemma)+'</div>')+'</td><td>'+(v.ok?'<span class="ok">1 new</span>':'<span class="no">'+(v.unk.length?'unknown: '+esc(v.unk.join(", ")):'new: '+esc(v.fresh.join(", ")))+'</span>')+'</td><td><button class="statebtn '+(st==="approved"?"approved":st==="fix"?"fix":"")+'" data-act="rev" data-id="'+esc(c.n)+'">'+(st==="fix"?"needs fix":st)+'</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

var cfilter="all";
function revOf(id){return S.rev[id]||"draft";}
function viewCards(){
  S.notes=S.notes||{};
  var cnt={draft:0,approved:0,fix:0};CARDS.forEach(function(c){cnt[revOf(c.n)]++;});
  var list=CARDS.filter(function(c){return cfilter==="all"||revOf(c.n)===cfilter;});
  function f(k,l,n){return '<button data-act="cfilter" data-v="'+k+'" aria-pressed="'+(cfilter===k)+'">'+l+' '+n+'</button>';}
  var h='<div class="stack"><div><div class="eyebrow">Teacher view</div><h1>All cards</h1></div>';
  h+='<div class="card stack"><p class="small">Read every card, then set a status and leave a note where something is off. Changes save at once in this browser. A card should only reach students once it is approved.</p>';
  h+='<div class="seg" role="group" aria-label="Filter">'+f("all","All",CARDS.length)+f("draft","Draft",cnt.draft)+f("approved","Approved",cnt.approved)+f("fix","Needs fix",cnt.fix)+'</div>';
  h+='<div class="row"><button class="btn small ghost" data-act="bulk" data-v="approved">Approve all shown ('+list.length+')</button><button class="btn small ghost" data-act="bulk" data-v="draft">Reset shown to draft</button><button class="btn small ghost" data-act="cexport">Show review as text</button></div>';
  if(S._cexp)h+='<textarea id="cexp" readonly aria-label="Review as text">'+esc(S._cexp)+'</textarea>';
  h+='</div>';
  if(!list.length)h+='<div class="card"><p class="small muted">No cards with this status.</p></div>';
  list.forEach(function(c){
    var i=IDX[c.n],st=revOf(c.n),v=validate(i);
    h+='<div class="card stack rc"><div class="row" style="justify-content:space-between"><span class="chip">#'+(i+1)+(c.p?' practice, no new word':' new: '+esc(lab(c)))+'</span><button class="btn small ghost" data-act="cplay" data-id="'+esc(c.n)+'" aria-label="Play audio">Play</button></div>';
    h+='<div lang="de" class="rcde">'+dehtml(c.de)+'</div><div>'+esc(c.en)+'</div>';
    h+='<div class="small muted">Literal: '+esc(c.lit)+'</div><div class="small">'+esc(c.gloss)+'</div>';
    if(c.note)h+='<div class="small muted">Note: '+esc(c.note)+'</div>';
    h+='<div class="small muted">Scene: '+esc(c.scene)+'</div>';
    h+='<div class="small muted">Frame: '+esc(c.f)+' &middot; '+(v.ok?'rule ok':'rule: '+(v.unk.length?'unknown '+esc(v.unk.join(", ")):'new '+esc(v.fresh.join(", "))))+'</div>';
    h+='<div class="seg" role="group" aria-label="Status of '+esc(c.n)+'">'+[["approved","Approved"],["fix","Needs fix"],["draft","Draft"]].map(function(o){return '<button data-act="setrev" data-id="'+esc(c.n)+'" data-v="'+o[0]+'" aria-pressed="'+(st===o[0])+'">'+o[1]+'</button>';}).join("")+'</div>';
    h+='<textarea class="cnote" data-id="'+esc(c.n)+'" rows="2" placeholder="Note or better wording (optional)" aria-label="Note for '+esc(c.n)+'">'+esc(S.notes[c.n]||"")+'</textarea></div>';
  });
  return h+'</div>';
}

function voiceRow(){
  var r=rankedVoices(),cur=pickVoice();
  if(!("speechSynthesis" in window))return '<div class="sw"><div class="grow"><b>German voice</b><div class="small muted">This browser has no speech voices. Try Chrome, Edge or Safari.</div></div></div>';
  if(!r.length)return '<div class="sw"><div class="grow"><b>German voice</b><div class="small muted">No German voice found on this device yet. On iPhone: Settings, Accessibility, Spoken Content, Voices, German, and download an Enhanced or Premium voice. On Android: Settings, System, Languages, Text-to-speech, install German voice data. On a computer, Microsoft Edge has the most natural German voices built in.</div></div></div>';
  var opts=r.map(function(v,i){return '<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')'+(i===0&&!S.set.voice?" - recommended":"")+'</option>';}).join("");
  var weak=vScore(r[0])<20;
  return '<div class="sw" style="align-items:flex-start"><div class="grow"><b>German voice</b><div class="small muted">Pick the voice that sounds best to you, then test it.'+(weak?' The voices on this device are basic. For a much more natural sound, try Microsoft Edge, or download an Enhanced voice in your system settings.':'')+'</div></div><div class="stack" style="gap:8px;min-width:0;max-width:55%"><select id="voicesel" aria-label="German voice" style="width:100%;min-height:40px;font:inherit">'+opts+'</select><button class="btn small ghost" data-act="vtest">Test voice</button></div></div>';
}
function viewSettings(){
  var s=S.set;
  function seg(name,vals,cur,lab){return '<div class="seg" role="group" aria-label="'+name+'">'+vals.map(function(v){return '<button data-act="set" data-k="'+name+'" data-v="'+v+'" aria-pressed="'+(String(cur)===String(v))+'">'+(lab?lab(v):v)+'</button>';}).join("")+'</div>';}
  function sw(k,label,desc){return '<div class="sw"><div class="grow"><b>'+label+'</b><div class="small muted">'+desc+'</div></div><button class="statebtn '+(s[k]?"approved":"")+'" data-act="toggle" data-k="'+k+'" aria-pressed="'+(!!s[k])+'" style="min-width:56px;min-height:36px">'+(s[k]?"On":"Off")+'</button></div>';}
  var h='<div class="stack"><div><div class="eyebrow">Account</div><h1>Settings</h1></div>';
  h+='<div class="card"><div class="sw"><div class="grow"><b>Cards a day</b><div class="small muted">Reviews and new cards together.</div></div>'+seg("goal",[5,15,30],s.goal)+'</div><div class="sw"><div class="grow"><b>Audio speed</b><div class="small muted">Playback rate of the German voice.</div></div>'+seg("speed",[0.7,0.85,1],s.speed,function(v){return v+"x";})+'</div>'+voiceRow()+
    sw("hide","Hide the text","Hide the sentence until you reveal it.")+sw("auto","Play audio automatically","The sentence plays when a card appears.")+sw("next","Show next review time","Show when each rating would bring a card back.")+'</div>';
  if(TEACHER)h+='<div class="card stack"><h2 style="margin:0">Demo controls</h2><p class="small muted">Reviews are scheduled in days, so use this to see them come back. The clock is shifted by '+Math.round(S.offset/DAY)+' day'+(Math.round(S.offset/DAY)===1?"":"s")+'.</p><div class="row"><button class="btn small" data-act="skip">Skip ahead 1 day</button><button class="btn small ghost" data-act="skipback">Reset clock</button></div></div>';
  h+='<div class="card stack"><h2 style="margin:0">Your data</h2><p class="small muted">Saved in this browser only.</p><div class="row"><button class="btn small ghost" data-act="export">Show progress as text</button>'+(S._confirm?'<button class="btn small" data-act="resetyes">Yes, erase everything</button><button class="btn small ghost" data-act="resetno">Cancel</button>':'<button class="btn small ghost" data-act="reset">Reset all progress</button>')+'</div>'+(S._export?'<textarea id="exp" readonly aria-label="Progress data">'+esc(S._export)+'</textarea>':"")+'</div></div>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener("change",function(e){var t=e.target;if(t&&t.id==="voicesel"){S.set.voice=t.value;save();speak("Guten Tag! Schön, dich zu sehen. Wie geht es dir heute?");}});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="tab"){if(sess)return;route=b.getAttribute("data-to");summary=route==="summary"?summary:summary;delete S._export;delete S._cexp;S._confirm=false;render();}
  else if(a==="begin"){var pw=document.getElementById("portal");if(pw&&pw.classList){pw.classList.add("open");b.disabled=true;}var rm=false;try{rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}setTimeout(startSession,rm?0:850);}
  else if(a==="show"){if(sess){sess.shown=true;renderSession();}}
  else if(a==="again")answer(false);
  else if(a==="shelve")shelve();
  else if(a==="jump")jumpTopic();
  else if(a==="stay"){sess.offer=null;sess.shelfRun=0;render();}
  else if(a==="unshelve"){Object.keys(S.cards).forEach(function(k){if(S.cards[k].st==="shelved")delete S.cards[k];});save();render();}
  else if(a==="good")answer(true);
  else if(a==="speak"){if(sess&&sess.cur&&!speak(sess.cur.c.de)){b.textContent="No voice on this device";}}
  else if(a==="quit")quit();
  else if(a==="shadow"){shadow={q:summary.passed.slice(),i:0,r:0,show:false};route="shadow";render();setTimeout(function(){speak(CARDS[IDX[shadow.q[0]]].de);},250);}
  else if(a==="shadowplay"){speak(CARDS[IDX[shadow.q[shadow.i]]].de);}
  else if(a==="shadowtext"){shadow.show=!shadow.show;renderShadow();}
  else if(a==="shadownext"){
    if(shadow.r<2){shadow.r++;}
    else if(shadow.i<shadow.q.length-1){shadow.i++;shadow.r=0;shadow.show=false;}
    else{route="today";shadow=null;render();return;}
    renderShadow();setTimeout(function(){speak(CARDS[IDX[shadow.q[shadow.i]]].de);},200);
  }
  else if(a==="shadowquit"){route="today";shadow=null;render();}
  else if(a==="rev"){var id=b.getAttribute("data-id"),cur=S.rev[id]||"draft";S.rev[id]=cur==="draft"?"approved":cur==="approved"?"fix":"draft";save();var y=window.scrollY;render();window.scrollTo(0,y);}
  else if(a==="cfilter"){cfilter=b.getAttribute("data-v");render();}
  else if(a==="setrev"){S.rev[b.getAttribute("data-id")]=b.getAttribute("data-v");save();var y2=window.scrollY;render();window.scrollTo(0,y2);}
  else if(a==="bulk"){var vv=b.getAttribute("data-v");CARDS.forEach(function(c){if(cfilter==="all"||revOf(c.n)===cfilter)S.rev[c.n]=vv;});save();render();}
  else if(a==="cplay"){var cc=CARDS[IDX[b.getAttribute("data-id")]];if(!speak(cc.de))b.textContent="No voice on this device";}
  else if(a==="cexport"){S.notes=S.notes||{};S._cexp=CARDS.map(function(c,i){return (i+1)+". ["+(revOf(c.n)==="fix"?"needs fix":revOf(c.n))+"] "+c.de+" / "+c.en+(S.notes[c.n]?"\n   Note: "+S.notes[c.n]:"");}).join("\n");render();}
  else if(a==="vtest"){speak("Guten Tag! Schön, dich zu sehen. Wie geht es dir heute?");}
  else if(a==="set"){var k=b.getAttribute("data-k"),v=parseFloat(b.getAttribute("data-v"));S.set[k]=v;save();render();}
  else if(a==="toggle"){var k2=b.getAttribute("data-k");S.set[k2]=!S.set[k2];save();render();}
  else if(a==="skip"){S.offset+=DAY;save();render();}
  else if(a==="skipback"){S.offset=0;save();render();}
  else if(a==="export"){S._export=JSON.stringify({cards:S.cards,log:S.log,set:S.set,rev:S.rev},null,1);render();}
  else if(a==="reset"){S._confirm=true;render();}
  else if(a==="resetno"){S._confirm=false;render();}
  else if(a==="resetyes"){S=fresh();save();route="today";render();}
});
document.addEventListener("input",function(e){
  var t=e.target;if(t&&t.classList&&t.classList.contains("cnote")){S.notes=S.notes||{};var id=t.getAttribute("data-id");if(t.value)S.notes[id]=t.value;else delete S.notes[id];save();}
});
document.addEventListener("keydown",function(e){
  if(route!=="session"||!sess||e.metaKey||e.ctrlKey)return;
  if(e.code==="Space"){e.preventDefault();if(!sess.shown){sess.shown=true;renderSession();}}
  else if(e.key==="1")answer(false);
  else if(e.key==="2")answer(true);
  else if(e.key==="3")shelve();
});
window.addEventListener("pagehide",function(){if(sess)save();});
render();
})();
</script>
